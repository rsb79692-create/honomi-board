<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>穂乃味ボード</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --paper:#E7E9E2; --surface:#FCFCFA; --ink:#1D2226; --ink2:#5E666C; --ink3:#8D9499;
    --line:#D3D6CB; --ceo:#2E4A6B; --bad:#B8443A;
  }
  html, body { margin:0; padding:0; background:var(--paper); }
  body { font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic","Meiryo",sans-serif;
    color:var(--ink); -webkit-font-smoothing:antialiased; padding-bottom:48px; }
  #v { max-width:640px; margin:0 auto; padding:16px 14px 0; }

  .name { font-size:17px; font-weight:700; letter-spacing:.04em; margin:0; }
  .who { font-size:12px; color:var(--ink2); margin:6px 0 0; }
  .room { font-size:13px; font-weight:700; color:var(--ink); letter-spacing:.04em;
    margin:26px 0 0; padding-bottom:5px; border-bottom:1px solid var(--line); }

  .sec { margin-top:18px; border-left:3px solid var(--ceo); padding-left:11px; }
  .sec-t { font-size:17px; font-weight:700; margin:0; }
  .note { background:var(--surface); border:1px solid var(--line); border-radius:4px; margin-top:8px; }
  .blk { padding:10px 12px; font-size:16px; line-height:1.75;
    white-space:pre-wrap; word-break:break-word; }
  .blk + .blk { border-top:1px solid #E2E4DC; }
  .empty { font-size:13px; color:var(--ink2); line-height:1.7; padding:12px 0 2px; margin:0; }

  .msg { max-width:360px; margin:60px auto; padding:0 20px; }
  .msg h1 { font-size:17px; font-weight:700; margin:0 0 8px; }
  .msg p { font-size:13px; color:var(--ink2); line-height:1.8; margin:0; }
  .msg .warn { color:var(--bad); }
  .foot { margin-top:28px; font-size:12px; color:var(--ink2); line-height:1.8; }
</style>
</head>
<body>
<div id="v"><div class="msg"><h1>読み込んでいます…</h1></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* 読むだけのページ。ログインの仕組み（firebase-auth）は読み込まない。 */
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyDkYQ5d8mskHo94WIysaFYP8VT2bIZ9Vtc",
  authDomain: "honomi-timecard.firebaseapp.com",
  databaseURL: "https://honomi-timecard-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "honomi-timecard",
  appId: "1:972990519633:web:68913a33250e5be920db70"
};
</script>

<script>
(function () {
  var app = document.getElementById("v");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function msg(title, body, warn) {
    app.innerHTML = '<div class="msg"><h1' + (warn ? ' class="warn"' : "") + ">" + esc(title) +
      "</h1>" + (body ? "<p>" + esc(body) + "</p>" : "") + "</div>";
  }

  /* あいことばは # のあと。# から先はサーバーにもリファラにも送られない。 */
  var token = "";
  try { token = decodeURIComponent(String(location.hash || "").replace(/^#/, "")).trim(); } catch (e) { token = ""; }

  if (!token) {
    msg("リンクが正しくありません", "お渡ししたURLを、途中で切れていないか確かめてから開いてください。");
    return;
  }
  /* 使える文字だけに限る。ここを緩めると別のパスを読みにいける。 */
  if (!/^[A-Za-z0-9_-]{22,64}$/.test(token)) {
    msg("リンクが正しくありません", "お渡ししたURLを、途中で切れていないか確かめてから開いてください。");
    return;
  }

  /* あいことばは URL に置いたままにする。
     消してしまうと、あとで開き直したときやブックマークから開いたときに読めなくなる。
     端末に控えを残す（localStorage 等）作りにすると、共有の端末で次の人に残ってしまう。 */

  firebase.initializeApp(FIREBASE_CONFIG);

  function two(n) { return (n < 10 ? "0" : "") + n; }
  function stamp(ts) {
    if (!ts) return "";
    var d = new Date(ts);
    return d.getFullYear() + "年" + (d.getMonth() + 1) + "月" + d.getDate() + "日 " +
      d.getHours() + ":" + two(d.getMinutes());
  }

  function paint(v) {
    if (v && v.rooms && !(v.rooms instanceof Array)) {
      /* RTDB は歯抜けの配列をオブジェクトで返すことがある */
      v.rooms = Object.keys(v.rooms).map(function (k) { return v.rooms[k]; });
    }
    if (!v || !v.rooms || !v.rooms.length) {
      msg("このリンクは使えません",
        "リンクが新しくなったか、閲覧が止められています。渡してくれた人に確かめてください。", true);
      return;
    }
    var h = '<h1 class="name">穂乃味ボード</h1>';
    /* 宛先は社長が入れたそのままの文字。「さん」を足すと「谷村さんさん」になる。 */
    if (v.who) h += '<p class="who">' + esc(v.who) + " 向け</p>";

    v.rooms.forEach(function (r) {
      if (r.name) h += '<p class="room">' + esc(r.name) + "</p>";
      var secs = r.secs || [];
      if (!(secs instanceof Array)) secs = Object.keys(secs).map(function (k) { return secs[k]; });
      secs.forEach(function (s) {
        h += '<section class="sec"><h2 class="sec-t">' + esc(s.title) + "</h2>";
        var items = s.items || [];
        if (!(items instanceof Array)) items = Object.keys(items).map(function (k) { return items[k]; });
        if (!items.length) { h += '<p class="empty">まだ何も書かれていません。</p></section>'; return; }
        h += '<div class="note">';
        items.forEach(function (t) { h += '<div class="blk">' + esc(t) + "</div>"; });
        h += "</div></section>";
      });
    });

    h += '<p class="foot">読むだけのページです。' +
      (v.updatedAt ? "最終更新 " + esc(stamp(v.updatedAt)) + "。" : "") +
      "<br>このURLは他の人に渡さないでください。</p>";
    app.innerHTML = h;
  }

  firebase.database().ref("views/" + token).on("value",
    function (s) { paint(s.val()); },
    function (e) {
      /* 失効した（作り直された・やめた・閲覧を止められた）ときは、
         ルール側で読めなくなるので拒否として返ってくる。 */
      if (e && e.code === "PERMISSION_DENIED") {
        msg("このリンクは使えません",
          "リンクが新しくなったか、閲覧が止められています。渡してくれた人に確かめてください。", true);
        return;
      }
      msg("いま開けませんでした",
        "電波の届くところで、もう一度開いてみてください。それでも開かないときは渡してくれた人に確かめてください。", true);
    });
})();
</script>
</body>
</html>
