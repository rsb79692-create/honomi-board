<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>穂乃味ボード</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --paper:#E7E9E2; --surface:#FCFCFA; --ink:#1D2226; --ink2:#5E666C; --ink3:#8D9499;
    --line:#D3D6CB; --ceo:#2E4A6B; --mgr:#55457A; --ok:#4C8055; --warn:#C88F1E; --bad:#B8443A;
  }
  html, body { margin:0; padding:0; background:var(--paper); }
  body { font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic","Meiryo",sans-serif;
    color:var(--ink); -webkit-font-smoothing:antialiased; padding-bottom:48px; }
  #app { max-width:640px; margin:0 auto; }
  button { font-family:inherit; cursor:pointer; }
  :focus-visible { outline:2px solid var(--ceo); outline-offset:2px; }

  .gate { padding:60px 20px; max-width:360px; margin:0 auto; }
  .gate h1 { font-size:19px; margin:0 0 6px; letter-spacing:.04em; }
  .gate p { font-size:13px; color:var(--ink2); line-height:1.7; margin:0 0 20px; }
  .gate input { width:100%; padding:12px; font-size:16px; font-family:inherit; border:1px solid var(--line);
    border-radius:3px; background:var(--surface); color:var(--ink); }
  .gate button { width:100%; margin-top:10px; padding:12px; font-size:14px; font-weight:600; border:0;
    border-radius:3px; background:var(--ink); color:#fff; }
  .gate .err { color:var(--bad); font-size:13px; margin-top:10px; }

  .top { padding:14px 14px 0; }
  .brand { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .name { font-size:17px; font-weight:700; letter-spacing:.04em; margin:0; }
  .sub { font-size:11px; color:var(--ink3); }
  .whoami { display:flex; align-items:center; gap:10px; margin-top:8px; font-size:12px; color:var(--ink2); }
  .whoami .tagme { font-weight:700; color:#fff; padding:3px 9px; border-radius:3px; font-size:12px; }
  .whoami button { background:none; border:0; font-size:12px; color:var(--ink3); padding:0; }

  .rooms { display:flex; gap:6px; margin-top:12px; overflow-x:auto; padding-bottom:2px; }
  .rooms button { flex:none; padding:7px 13px; font-size:13px; font-weight:600; border:1px solid var(--line);
    border-radius:20px; background:transparent; color:var(--ink2); display:flex; align-items:center; gap:6px; }
  .rooms button[data-on="1"] { background:var(--ink); border-color:var(--ink); color:#fff; }
  .rooms .plus { font-weight:400; color:var(--ink3); }

  .tabs { display:flex; margin-top:14px; border-bottom:1px solid var(--line); }
  .tabs button { flex:1; padding:11px 0 9px; background:none; border:0; border-bottom:2px solid transparent;
    font-size:14px; font-weight:600; color:var(--ink3); margin-bottom:-1px;
    display:flex; align-items:center; justify-content:center; gap:6px; }
  .tabs button[data-on="1"] { color:var(--ink); border-bottom-color:var(--ink); }
  .badge { min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--bad); color:#fff;
    font-size:11px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; }

  .body { padding:4px 14px 0; }
  .notice { margin-top:14px; border:1px solid var(--warn); border-radius:4px; background:var(--surface);
    padding:10px 12px; font-size:13px; line-height:1.7; color:var(--ink2); }
  .sec { margin-top:20px; border-left:3px solid var(--line); padding-left:11px; }
  .sec[data-v="ceo"] { border-left-color:var(--ceo); }
  .sec[data-v="mgr"] { border-left-color:var(--mgr); }
  .sec-h { display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .sec-t { font-size:15px; font-weight:700; margin:0; }
  .sec-n { font-size:11px; color:var(--ink3); }
  .sec-d { font-size:12px; color:var(--ink2); margin:3px 0 10px; line-height:1.6; }

  .comp { background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:9px 10px; margin-top:8px; }
  .comp textarea { width:100%; border:0; resize:none; font-family:inherit; font-size:14px; line-height:1.65;
    background:transparent; color:var(--ink); min-height:44px; }
  .comp textarea:focus { outline:none; }
  .comp textarea::placeholder { color:var(--ink3); }
  .comp-b { display:flex; align-items:center; margin-top:6px; }
  .send { margin-left:auto; padding:6px 14px; font-size:13px; font-weight:600; border:0; border-radius:3px;
    background:var(--ink); color:#fff; }
  .send.plain { margin-left:0; }

  .list { background:var(--surface); border:1px solid var(--line); border-radius:4px; margin-top:8px; }
  .item { display:flex; align-items:flex-start; gap:6px; padding:9px 8px 9px 4px;
    border-top:1px solid var(--line); background:var(--surface); }
  .item:first-child { border-top:0; }
  .item[data-done="1"] .text { color:var(--ink3); text-decoration:line-through; }
  .item.dragging { opacity:.5; }
  .grip { align-self:stretch; width:28px; min-height:40px; border:0; background:transparent; padding:0;
    color:#BFC4BB; font-size:15px; letter-spacing:1px; cursor:grab; touch-action:none; }
  .grip:hover { color:var(--ink2); background:#F1F2EC; }
  .grip:active { cursor:grabbing; }
  .ibody { flex:1; min-width:0; }
  .side { display:flex; flex-direction:column; align-items:flex-end; gap:5px; flex:none; padding-top:1px; }
  .side button { background:none; border:0; padding:1px 0; font-size:12px; font-weight:600; color:var(--ink2); }
  .side button[data-act="del"] { color:var(--ink3); font-weight:400; }
  .text { font-size:14px; line-height:1.7; white-space:pre-wrap; word-break:break-word; margin:0; }
  .meta { display:flex; align-items:center; gap:7px; font-size:11px; color:var(--ink3); margin-top:4px; flex-wrap:wrap; }
  .reply { margin-top:9px; padding-left:10px; border-left:2px solid var(--line); }
  .reply p { margin:0; font-size:13px; line-height:1.65; white-space:pre-wrap; }
  .rin { display:flex; gap:6px; margin-top:8px; }
  .rin input { flex:1; border:1px solid var(--line); border-radius:3px; padding:8px 9px; font-size:13px;
    font-family:inherit; background:var(--surface); color:var(--ink); }
  .empty { font-size:13px; color:var(--ink3); line-height:1.7; padding:12px 0 2px; margin:0; }

  .alert { margin-top:14px; border:1px solid var(--bad); border-radius:4px; background:var(--surface); overflow:hidden; }
  .alert-h { padding:9px 12px; font-size:13px; font-weight:700; color:var(--bad); border-bottom:1px solid var(--line); }
  .alert ul { margin:0; padding:8px 12px 10px 26px; }
  .alert li { font-size:13px; line-height:1.75; }

  .pick { display:flex; align-items:center; gap:8px; margin-top:14px; }
  .pick select { flex:1; font-family:inherit; font-size:15px; font-weight:600; padding:10px;
    border:1px solid var(--line); border-radius:3px; background:var(--surface); color:var(--ink); }
  .pick button { background:none; border:0; font-size:12px; color:var(--ink3); padding:0; white-space:nowrap; }

  .panel { margin-top:10px; border:1px solid var(--line); border-radius:4px; background:var(--surface); padding:12px; }
  .panel h3 { margin:0 0 4px; font-size:13px; font-weight:700; }
  .panel p { margin:0 0 8px; font-size:12px; color:var(--ink2); line-height:1.7; }
  .pline { display:flex; gap:8px; align-items:center; padding:7px 0; border-top:1px solid var(--line); }
  .pline:first-of-type { border-top:0; }
  .pline input[type="text"], .pline input:not([type]) { flex:1; border:0; border-bottom:1px dashed var(--line);
    background:transparent; font-family:inherit; font-size:14px; padding:3px 0; color:var(--ink); }
  .pline input:focus { outline:none; border-bottom-color:var(--ink); }
  .pline button { background:none; border:0; font-size:12px; color:var(--ink3); }
  .pname { flex:1; font-size:14px; }
  .pnote { font-size:11px; color:var(--ink3); }
  .chk { display:flex; align-items:center; gap:8px; padding:6px 0; font-size:14px; }
  .chk input { width:18px; height:18px; }
  .field { margin-top:12px; }
  .field label { display:block; font-size:12px; font-weight:700; margin-bottom:4px; }
  .field input { width:100%; padding:9px; font-size:14px; font-family:inherit; border:1px solid var(--line);
    border-radius:3px; background:var(--paper); color:var(--ink); }
  .btn { margin-top:10px; padding:9px 14px; font-size:13px; font-weight:600; border:0; border-radius:3px;
    background:var(--ink); color:#fff; }
  .btn.ghost { background:transparent; color:var(--ink2); border:1px solid var(--line); }

  .fac { background:var(--surface); border:1px solid var(--line); border-radius:4px; margin-top:12px; overflow:hidden; }
  .fac-h { display:flex; align-items:center; gap:10px; padding:11px 12px; border-bottom:1px solid var(--line); }
  .dot { width:16px; height:16px; border-radius:50%; flex:none; border:0; padding:0; }
  .fac-n { font-size:15px; font-weight:700; flex:1; }
  .fac-d { font-size:11px; color:var(--ink3); }
  .fac .list { border:0; border-radius:0; margin:0; }
  .fac .item { border-top:1px solid var(--line); }
  .fac .comp { border:0; border-top:1px solid var(--line); border-radius:0; margin:0; background:#FAFAF7; }

  .row { background:var(--surface); border:1px solid var(--line); border-radius:4px; margin-top:8px; padding:10px 12px; }
  .row.stale { border-color:var(--bad); }
  .row-h { display:flex; align-items:center; gap:10px; }
  .row-n { font-size:14px; font-weight:700; flex:1; }
  .row-d { font-size:11px; color:var(--ink3); }
  .flag { font-size:11px; font-weight:700; color:var(--bad); }
  .tag { font-size:11px; color:var(--ink3); }
  .inline { width:100%; margin-top:7px; border:0; border-bottom:1px dashed var(--line); background:transparent;
    font-family:inherit; font-size:13px; line-height:1.6; color:var(--ink2); padding:3px 0; }
  .inline:focus { outline:none; border-bottom-color:var(--ink); color:var(--ink); }
  .acts { display:flex; gap:14px; margin-top:9px; align-items:center; }
  .acts button { background:none; border:0; padding:0; font-size:12px; color:var(--ink2); font-weight:600; }
  .acts .del { margin-left:auto; color:var(--ink3); font-weight:400; }
  .add { width:100%; margin-top:8px; padding:9px; border:1px dashed var(--line); border-radius:4px;
    background:transparent; font-size:13px; color:var(--ink2); font-weight:600; }
  .foot { margin-top:26px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  .foot button { background:none; border:0; font-size:12px; color:var(--ink3); padding:0; }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ▼▼ Firebaseコンソールの値 ▼▼ */
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyDkYQ5d8mskHo94WIysaFYP8VT2bIZ9Vtc",
  authDomain: "honomi-timecard.firebaseapp.com",
  databaseURL: "https://honomi-timecard-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "honomi-timecard",
  appId: "1:972990519633:web:68913a33250e5be920db70"
};
/* ▲▲ ここまで ▲▲ */
</script>

<script>
(function () {
  firebase.initializeApp(FIREBASE_CONFIG);
  var auth = firebase.auth(), rtdb = firebase.database();
  var DAY = 86400000;
  var STATUS = { green: "var(--ok)", yellow: "var(--warn)", red: "var(--bad)" };
  var NEXT = { green: "yellow", yellow: "red", red: "green" };
  var EMPTY_BOARD = { ceoMind: [], toCeo: [], mgrAsk: [], toManager: [] };
  var EMPTY_FIELD = { facilities: [], staff: [], cases: [] };

  var me = null;                 /* {uid, role, name, mail} */
  var conf = { ceoName: "谷口" };
  var members = {};              /* uid -> {name, mail, role, active} */
  var rooms = {};                /* rid -> {name, members:{uid:true}, board:{}} */
  var field = JSON.parse(JSON.stringify(EMPTY_FIELD));
  var roomRefs = {}, saveTimers = {};

  var ui = { tab: "board", room: "", saving: "", draft: {}, replyOpen: null, replyDraft: "",
             addOpen: null, addDraft: "", addPlace: "", pick: "", editList: false,
             settings: false, newRoom: false, newRoomName: "", newRoomPick: {},
             invite: false, gateErr: "", msg: "" };

  var isCeo = function () { return me && me.role === "ceo"; };
  function nameOfUid(u) {
    if (me && u === me.uid) return me.name || "自分";
    var m = members[u];
    return (m && m.name) || "だれか";
  }
  function room() { return rooms[ui.room] || null; }
  function board() {
    var r = room(); if (!r) return EMPTY_BOARD;
    if (!r.board) r.board = JSON.parse(JSON.stringify(EMPTY_BOARD));
    return r.board;
  }
  function myRooms() {
    return Object.keys(rooms).sort(function (a, b) {
      return (rooms[a].name || "").localeCompare(rooms[b].name || "");
    });
  }

  /* この部屋にいる「自分以外」の相手の名前。
     wantCeo=true → 社長側、false → 現場側。見出しを閲覧者から見た向きにするために使う。 */
  function partyLabel(wantCeo) {
    var r = room(), ns = [];
    if (r && me) {
      Object.keys(r.members || {}).forEach(function (u) {
        if (u === me.uid) return;
        var m = members[u];
        var isC = !!(m && m.role === "ceo");
        if (isC !== !!wantCeo) return;
        var n = (m && m.name) || (isC ? (conf.ceoName || "") : "");
        if (n) ns.push(n + "さん");
      });
    }
    /* 名簿が読めなかったときの保険（社長名は config にも持っている） */
    if (!ns.length && wantCeo && conf.ceoName) ns.push(conf.ceoName + "さん");
    return ns.join("、");
  }

  function sections() {
    var ceo  = isCeo();
    var you  = partyLabel(false);   /* 社長から見た相手（現場側） */
    var boss = partyLabel(true);    /* 現場から見た相手（社長） */
    /* ビジョンと指針は社長が書く欄。報告と相談は現場が書く欄。
       どちらを「自分」と見るかで向きが変わるので、閲覧者基準で組み立てる。 */
    var vision = ceo ? "わたしのビジョン" : (boss ? boss + "のビジョン" : "ビジョン");
    var report = ceo ? (you ? you + "からの報告" : "報告")
                     : (boss ? boss + "への報告" : "報告");
    var ask    = ceo ? (you ? you + "からの相談" : "相談")
                     : (boss ? boss + "への相談" : "相談");
    var guide  = ceo ? (you ? you + "への指針" : "指針")
                     : (boss ? boss + "からの指針" : "指針");
    /* 各欄の書き手は片側だけ（voice が書き手）。もう片方は読んで「見た」とコメントで返す。
       書けない側には、誰が書く場所なのかを出す。 */
    var lockedByBoss = function (tail) {
      return (boss || "社長") + "が書く場所です。" + tail;
    };
    var lockedByYou = function (tail) {
      return you ? you + "が書く場所です。" + tail
                 : "この部屋にはまだ相手がいません。設定から相手を入れてください。";
    };
    var READ = "目を通したら「見た」を押してください。";
    return [
      { key: "ceoMind", voice: "ceo", title: vision,
        desc: "", locked: lockedByBoss("読んで、気になったらコメントしてください。"),
        ph: "いま頭にあることを、まとまっていなくても書く" },
      { key: "toCeo", voice: "mgr", title: report,
        desc: "", locked: lockedByYou(READ),
        ph: "現場で見えたこと、気づいたことを書く" },
      { key: "mgrAsk", voice: "mgr", title: ask,
        desc: "", locked: lockedByYou(READ),
        ph: "相談したいこと・提案を書く" },
      { key: "toManager", voice: "ceo", title: guide,
        desc: "", locked: lockedByBoss(READ),
        ph: "考え方・判断・伝えておきたいことを書く" }
    ];
  }

  /* ---------- 小道具 ---------- */
  function uid() { return Math.random().toString(36).slice(2, 9) + Date.now().toString(36); }
  function now() { return Date.now(); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function ago(ts) {
    if (!ts) return "未";
    var d = Math.floor((now() - ts) / DAY);
    if (d <= 0) return "今日"; if (d === 1) return "昨日";
    if (d < 31) return d + "日前"; return Math.floor(d / 30) + "か月前";
  }
  function toArr(v) { return Array.isArray(v) ? v : (v ? Object.keys(v).map(function (k) { return v[k]; }) : []); }
  function normBoard(b) {
    b = b || {};
    var o = {};
    ["ceoMind", "toCeo", "mgrAsk", "toManager"].forEach(function (k) { o[k] = toArr(b[k]); });
    return o;
  }
  function normField(f) {
    f = f || {};
    var o = { facilities: toArr(f.facilities), staff: toArr(f.staff), cases: toArr(f.cases) };
    o.facilities.forEach(function (x) { x.items = toArr(x.items); });
    return o;
  }

  function saveBoard() {
    var rid = ui.room; if (!rid) return;
    queue("room:" + rid, function () {
      return rtdb.ref("rooms/" + rid + "/board").set(JSON.parse(JSON.stringify(board())));
    });
  }
  function saveField() {
    queue("field", function () { return rtdb.ref("field").set(JSON.parse(JSON.stringify(field))); });
  }
  function queue(k, fn) {
    ui.saving = "保存中";
    paintStatus();
    clearTimeout(saveTimers[k]);
    saveTimers[k] = setTimeout(function () {
      fn().then(function () { ui.saving = "保存済み"; paintStatus(); })
          .catch(function (e) { ui.saving = "保存できません（" + e.code + "）"; paintStatus(); });
    }, 400);
  }
  function paintStatus() { var el = document.querySelector("#status"); if (el) el.textContent = ui.saving || ""; }

  function fac(id) { return field.facilities.filter(function (f) { return f.id === id; })[0]; }
  function facName(id) { var f = fac(id); return f ? f.name : ""; }
  function arrFor(key) {
    if (key.indexOf("fac:") === 0) { var f = fac(key.slice(4)); if (!f) return []; if (!f.items) f.items = []; return f.items; }
    if (key === "facilities" || key === "staff" || key === "cases") return field[key];
    return board()[key] || [];
  }
  function setArr(key, v) {
    if (key.indexOf("fac:") === 0) { var f = fac(key.slice(4)); if (f) f.items = v; return; }
    if (key === "facilities" || key === "staff" || key === "cases") { field[key] = v; return; }
    board()[key] = v;
  }
  function isFieldKey(k) {
    return k.indexOf("fac:") === 0 || k === "facilities" || k === "staff" || k === "cases";
  }
  function saveFor(key) { if (isFieldKey(key)) saveField(); else saveBoard(); }
  function find(key, id) { return arrFor(key).filter(function (x) { return x.id === id; })[0]; }

  /* ---------- 入口 ---------- */
  function gateHtml() {
    return '<div class="gate"><h1>穂乃味ボード</h1>' +
      '<input id="mail" type="email" inputmode="email" placeholder="メールアドレス" autocomplete="username">' +
      '<input id="pw" type="password" placeholder="パスワード" autocomplete="current-password" style="margin-top:8px">' +
      '<button data-act="login">開く</button>' +
      '<button data-act="forgot" style="background:transparent;color:var(--ink3);font-weight:400">パスワードを忘れた</button>' +
      (ui.gateErr ? '<p class="err">' + esc(ui.gateErr) + "</p>" : "") + "</div>";
  }

  function captureDrafts() {
    var t = document.querySelectorAll("textarea[data-draft]");
    for (var i = 0; i < t.length; i++) ui.draft[t[i].getAttribute("data-draft")] = t[i].value;
    var r = document.querySelector("#replyInput"); if (r) ui.replyDraft = r.value;
    var a = document.querySelector("#addInput"); if (a) ui.addDraft = a.value;
    var ap = document.querySelector("#addPlace"); if (ap) ui.addPlace = ap.value;
    var rn = document.querySelector("#roomName"); if (rn) ui.newRoomName = rn.value;
  }

  /* ---------- 描画 ---------- */
  function render() {
    if (!me) {
      document.getElementById("app").innerHTML = gateHtml();
      var p = document.querySelector("#mail"); if (p) p.focus();
      return;
    }

    var ids = myRooms();
    if (ids.length && !rooms[ui.room]) ui.room = ids[0];

    var SEC = sections();
    var b = board();
    var unread = 0;
    SEC.forEach(function (sc) {
      unread += (b[sc.key] || []).filter(function (x) {
        return !x.done && !(x.seenBy && x.seenBy[me.uid]) && x.by !== me.uid;
      }).length;
    });
    var stale = field.cases.filter(function (c) { return !c.done && now() - c.updatedAt > 7 * DAY; });
    var cold = field.staff.filter(function (s) { return now() - (s.followedAt || 0) > 14 * DAY; });
    var alerts = stale.length + cold.length;

    var h = '<div class="top"><div class="brand"><h1 class="name">穂乃味ボード</h1>' +
      '<span class="sub" id="status">' + esc(ui.saving || "") + "</span></div>" +
      '<div class="whoami"><span class="tagme" style="background:' +
      (isCeo() ? "var(--ceo)" : "var(--mgr)") + '">' + esc(me.name || me.mail) + "</span>" +
      (isCeo() ? '<button data-act="settings">設定</button>' : "") +
      '<button data-act="logout">ログアウト</button></div>';

    h += '<div class="rooms">';
    ids.forEach(function (rid) {
      h += '<button data-act="room" data-id="' + rid + '" data-on="' + (ui.room === rid ? 1 : 0) + '">' +
        esc(rooms[rid].name || "名前なし") + "</button>";
    });
    if (isCeo()) h += '<button class="plus" data-act="newroom">＋</button>';
    h += "</div>";

    h += '<div class="tabs">' +
      '<button data-act="tab" data-v="board" data-on="' + (ui.tab === "board" ? 1 : 0) + '">共有ボード' +
      (unread ? '<span class="badge">' + unread + "</span>" : "") + "</button>" +
      '<button data-act="tab" data-v="field" data-on="' + (ui.tab === "field" ? 1 : 0) + '">現場マネジメント' +
      (alerts ? '<span class="badge">' + alerts + "</span>" : "") + "</button></div></div>";

    h += '<div class="body">';
    if (ui.msg) h += '<div class="notice">' + esc(ui.msg) + "</div>";
    if (ui.newRoom && isCeo()) h += newRoomHtml();
    if (ui.settings && isCeo()) h += settingsHtml();

    if (ui.tab === "board") {
      h += ids.length ? boardHtml(SEC) : "";
    } else h += fieldHtml(stale, cold);

    h += "</div>";

    var act = document.activeElement;
    var keepKey = act && act.getAttribute ? act.getAttribute("data-draft") : null;
    if (keepKey) captureDrafts();
    document.getElementById("app").innerHTML = h;
    var f = null;
    if (keepKey) f = document.querySelector('textarea[data-draft="' + keepKey + '"]');
    if (!f) f = document.querySelector("#replyInput") || document.querySelector("#addInput");
    if (f) { f.focus(); try { f.setSelectionRange(f.value.length, f.value.length); } catch (e) {} }
  }

  function newRoomHtml() {
    var h = '<div class="panel"><h3>部屋を作る</h3>' +
      '<div class="field"><label>部屋の名前</label>' +
      '<input id="roomName" value="' + esc(ui.newRoomName) + '" placeholder="部屋の名前"></div>';
    Object.keys(members).forEach(function (u) {
      if (u === me.uid) return;
      var m = members[u] || {};
      if (m.active === false) return;
      h += '<label class="chk"><input type="checkbox" data-pickuid="' + u + '"' +
        (ui.newRoomPick[u] ? " checked" : "") + "><span>" + esc(m.name || m.mail || u) + "</span></label>";
    });
    return h + '<button class="btn" data-act="makeroom">作る</button>' +
      '<button class="btn ghost" data-act="newroom" style="margin-left:8px">やめる</button></div>';
  }

  function settingsHtml() {
    var h = '<div class="panel"><h3>設定</h3>' +
      '<div class="field"><label>あなたの表示名</label>' +
      '<input data-mname="' + me.uid + '" value="' + esc(me.name || "") + '" placeholder="谷口"></div>';

    h += '<h3 style="margin-top:18px">部屋</h3>';
    myRooms().forEach(function (rid) {
      var r = rooms[rid];
      var who = Object.keys(r.members || {}).filter(function (u) { return u !== me.uid; })
        .map(nameOfUid).join("、");
      h += '<div class="pline"><span class="pname">' + esc(r.name || "名前なし") + "</span>" +
        '<span class="pnote">' + esc(who || "自分だけ") + "</span>" +
        '<button data-act="editroom" data-id="' + rid + '">変える</button>' +
        '<button data-act="delroom" data-id="' + rid + '">削除</button></div>';
    });

    h += '<h3 style="margin-top:18px">利用者</h3>';
    Object.keys(members).forEach(function (u) {
      var m = members[u] || {};
      if (u === me.uid) {
        h += '<div class="pline"><span class="pname">' + esc(m.name || m.mail || u) +
          '</span><span class="pnote">あなた</span></div>';
        return;
      }
      h += '<div class="pline"><input value="' + esc(m.name || "") + '" data-mname="' + u +
        '" placeholder="表示名">' +
        '<span class="pnote" style="color:' + (m.active === false ? "var(--bad)" : "var(--ink3)") + '">' +
        (m.active === false ? "止めています" : "使えます") + "</span>" +
        '<button data-act="member" data-id="' + u + '" style="font-weight:700;color:' +
        (m.active === false ? "var(--ok)" : "var(--bad)") + '">' +
        (m.active === false ? "戻す" : "止める") + "</button></div>";
    });

    if (ui.invite) {
      h += '<div class="field"><label>名前</label><input id="invName" placeholder="谷村"></div>' +
        '<div class="field"><label>メールアドレス</label><input id="invMail" type="email" placeholder="mail@example.com"></div>' +
        '<div class="field"><label>最初のパスワード（6文字以上）</label><input id="invPw" type="text" placeholder="6文字以上"></div>' +
        '<button class="btn" data-act="doinvite">登録する</button>' +
        '<button class="btn ghost" data-act="invite" style="margin-left:8px">やめる</button>';
    } else {
      h += '<button class="btn ghost" data-act="invite">人を追加する</button>';
    }

    return h + '<div style="margin-top:16px"><button data-act="settings" style="background:none;border:0;font-size:12px;color:var(--ink3)">設定を閉じる</button></div></div>';
  }

  function itemHtml(key, it, opts) {
    var mine = me && it.by === me.uid;
    /* 「見た」は自分の投稿を相手が読んだときだけ出す（自分が読んだ印は出さない） */
    var seenByOther = it.seenBy ? Object.keys(it.seenBy).filter(function (u) {
      return !me || u !== me.uid; }).length : 0;
    var h = '<article class="item" data-id="' + it.id + '" data-list="' + key + '" data-done="' +
      (it.done ? 1 : 0) + '">' +
      '<button class="grip" data-grip title="つかんで動かす">⣿</button>' +
      '<div class="ibody"><p class="text">' + esc(it.text) + "</p>" +
      '<div class="meta"><span>' + esc(nameOfUid(it.by)) + "</span><span>" + ago(it.createdAt) + "</span>" +
      (mine && seenByOther ? "<span>相手が見た</span>" : "") + "</div>";

    (it.replies ? toArr(it.replies) : []).forEach(function (r) {
      h += '<div class="reply"><div class="meta"><span style="font-weight:700">' +
        esc(nameOfUid(r.by)) + "</span><span>" + ago(r.createdAt) + "</span></div><p>" + esc(r.text) + "</p></div>";
    });

    if (ui.replyOpen === it.id) {
      h += '<div class="rin"><input id="replyInput" value="' + esc(ui.replyDraft) +
        '" placeholder="コメントを書く"><button class="send plain" data-act="rsend" data-list="' +
        key + '" data-id="' + it.id + '">送る</button></div>';
    }

    h += '</div><div class="side">';
    if (!mine && !(it.seenBy && it.seenBy[me.uid]))
      h += '<button data-act="seen" data-list="' + key + '" data-id="' + it.id + '">見た</button>';
    if (!mine) h += '<button data-act="reply" data-id="' + it.id + '">コメント</button>';
    if (mine || opts.anyDelete)
      h += '<button data-act="del" data-list="' + key + '" data-id="' + it.id + '">削除</button>';
    return h + "</div></article>";
  }

  function compHtml(key, ph, label) {
    return '<div class="comp"><textarea rows="2" data-draft="' + key + '" placeholder="' + ph + '">' +
      esc(ui.draft[key] || "") + '</textarea><div class="comp-b">' +
      '<button class="send" data-act="post" data-list="' + key + '">' + (label || "書く") + "</button></div></div>";
  }

  function boardHtml(SEC) {
    var b = board();
    return SEC.map(function (s) {
      var items = b[s.key] || [];
      var open = items.filter(function (x) { return !x.done; });
      var h = '<section class="sec" data-v="' + s.voice + '"><div class="sec-h">' +
        '<h2 class="sec-t">' + esc(s.title) + '</h2><span class="sec-n">' + open.length + "件</span></div>" +
        (s.desc ? '<p class="sec-d">' + esc(s.desc) + "</p>" : "");
      /* voice が "ceo" の欄は社長が、"mgr" の欄は現場側が書く */
      var canWrite = (s.voice === "ceo") === isCeo();
      h += canWrite ? compHtml(s.key, s.ph)
                    : '<p class="empty">' + esc(s.locked) + "</p>";
      if (items.length) {
        h += '<div class="list">';
        items.forEach(function (it) { h += itemHtml(s.key, it, { anyDelete: isCeo() }); });
        h += "</div>";
      }
      return h + "</section>";
    }).join("");
  }

  function fieldHtml(stale, cold) {
    var h = "";
    if (stale.length || cold.length) {
      h += '<div class="alert"><div class="alert-h">止まっているもの</div><ul>';
      stale.forEach(function (c) { h += "<li>" + esc(c.title) + "（" + ago(c.updatedAt) + "から動いていない）</li>"; });
      cold.forEach(function (s) { h += "<li>" + esc(s.name) + "（" + ago(s.followedAt) + "から話せていない）</li>"; });
      h += "</ul></div>";
    }

    h += '<div class="pick"><select id="pickSel"><option value="">すべての施設</option>';
    field.facilities.forEach(function (f) {
      h += '<option value="' + f.id + '"' + (ui.pick === f.id ? " selected" : "") + ">" + esc(f.name) + "</option>";
    });
    h += '</select><button data-act="editlist">' + (ui.editList ? "リストを閉じる" : "施設リスト") + "</button></div>";

    if (ui.editList) {
      h += '<div class="panel"><h3>施設リスト</h3>';
      field.facilities.forEach(function (f) {
        h += '<div class="pline"><input value="' + esc(f.name) + '" data-list="facilities" data-id="' + f.id +
          '" data-field="name" placeholder="施設名">' +
          '<button data-act="del" data-list="facilities" data-id="' + f.id + '">削除</button></div>';
      });
      h += addHtml("facilities", "施設を追加", "施設名") + "</div>";
    }

    var shown = field.facilities.filter(function (f) { return !ui.pick || f.id === ui.pick; });

    shown.forEach(function (f) {
      var key = "fac:" + f.id;
      h += '<div class="fac"><div class="fac-h">' +
        '<button class="dot" style="background:' + STATUS[f.status] + '" data-act="cycle" data-id="' + f.id + '"></button>' +
        '<span class="fac-n">' + esc(f.name) + '</span><span class="fac-d">' + ago(f.updatedAt) + "</span></div>";
      if ((f.items || []).length) {
        h += '<div class="list">';
        f.items.forEach(function (it) { h += itemHtml(key, it, { anyDelete: isCeo() }); });
        h += "</div>";
      }
      h += compHtml(key, "この施設のことを書き足す", "足す") + "</div>";
    });

    var match = function (x) { return !ui.pick || x.place === ui.pick; };
    var open = field.cases.filter(function (c) { return !c.done && match(c); });
    var done = field.cases.filter(function (c) { return c.done; });
    h += '<section class="sec"><div class="sec-h"><h2 class="sec-t">対応中の案件</h2>' +
      '<span class="sec-n">' + open.length + "件</span></div>";
    open.forEach(function (c) {
      var st = now() - c.updatedAt > 7 * DAY;
      h += '<div class="row' + (st ? " stale" : "") + '"><div class="row-h">' +
        '<span class="row-n">' + esc(c.title) + "</span>" +
        (st ? '<span class="flag">止まっている</span>' : "") +
        '<span class="row-d">' + ago(c.updatedAt) + "</span></div>" +
        (c.place ? '<div class="tag">' + esc(facName(c.place)) + "</div>" : "") +
        '<input class="inline" data-list="cases" data-id="' + c.id + '" data-field="next" value="' +
        esc(c.next) + '" placeholder="次にすること">' +
        '<div class="acts"><button data-act="bump" data-id="' + c.id + '">動いた</button>' +
        '<button data-act="finish" data-id="' + c.id + '">完了</button>' +
        '<button class="del" data-act="del" data-list="cases" data-id="' + c.id + '">削除</button></div></div>';
    });
    h += addHtml("cases", "案件を追加", "案件名");
    if (done.length) h += '<p class="empty">完了した案件 ' + done.length +
      '件<button style="background:none;border:0;color:var(--ink2);font-size:12px;margin-left:8px" data-act="clearDone">まとめて消す</button></p>';
    h += "</section>";

    var staff = field.staff.filter(match);
    h += '<section class="sec"><div class="sec-h"><h2 class="sec-t">スタッフで気になること</h2>' +
      '<span class="sec-n">' + staff.length + "人</span></div>";
    staff.forEach(function (p) {
      var isCold = now() - (p.followedAt || 0) > 14 * DAY;
      h += '<div class="row' + (isCold ? " stale" : "") + '"><div class="row-h">' +
        '<span class="row-n">' + esc(p.name) + "</span>" +
        (isCold ? '<span class="flag">フォロー切れ</span>' : "") +
        '<span class="row-d">' + ago(p.followedAt) + "</span></div>" +
        (p.place ? '<div class="tag">' + esc(facName(p.place)) + "</div>" : "") +
        '<input class="inline" data-list="staff" data-id="' + p.id + '" data-field="concern" value="' +
        esc(p.concern) + '" placeholder="気になっていること">' +
        '<div class="acts"><button data-act="talked" data-id="' + p.id + '">話した</button>' +
        '<button class="del" data-act="del" data-list="staff" data-id="' + p.id + '">削除</button></div></div>';
    });
    return h + addHtml("staff", "スタッフを追加", "スタッフ名") + "</section>";
  }

  function addHtml(list, label, ph) {
    if (ui.addOpen !== list) return '<button class="add" data-act="addopen" data-list="' + list + '">＋ ' + label + "</button>";
    var h = '<div class="rin"><input id="addInput" value="' + esc(ui.addDraft) + '" placeholder="' + ph + '">';
    if (list !== "facilities" && field.facilities.length) {
      h += '<select id="addPlace" style="font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:3px;background:var(--surface);padding:0 4px">' +
        '<option value="">施設なし</option>';
      field.facilities.forEach(function (f) {
        var sel = (ui.addPlace || ui.pick) === f.id ? " selected" : "";
        h += '<option value="' + f.id + '"' + sel + ">" + esc(f.name) + "</option>";
      });
      h += "</select>";
    }
    return h + '<button class="send plain" data-act="addsend" data-list="' + list + '">追加</button></div>';
  }

  /* ---------- 操作 ---------- */
  document.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("[data-act]") : null;
    if (!b) return;
    var act = b.getAttribute("data-act"), list = b.getAttribute("data-list"),
        id = b.getAttribute("data-id"), v = b.getAttribute("data-v"), it;

    if (act === "login") {
      var m = document.querySelector("#mail"), w = document.querySelector("#pw");
      ui.gateErr = "";
      auth.signInWithEmailAndPassword((m ? m.value : "").trim(), w ? w.value : "")
        .catch(function (err) {
          ui.gateErr = /invalid-credential|wrong-password|user-not-found/.test(err.code)
            ? "メールアドレスかパスワードが違います。" : "開けませんでした（" + err.code + "）";
          render();
        });
      return;
    }
    if (act === "forgot") {
      var m2 = document.querySelector("#mail");
      var addr = (m2 ? m2.value : "").trim();
      if (!addr) { ui.gateErr = "先にメールアドレスを入れてください。"; render(); return; }
      auth.sendPasswordResetEmail(addr)
        .then(function () { ui.gateErr = "再設定のメールを送りました。"; render(); })
        .catch(function (err) { ui.gateErr = "送れませんでした（" + err.code + "）"; render(); });
      return;
    }

    captureDrafts();
    ui.msg = "";

    if (act === "logout") { auth.signOut(); return; }
    else if (act === "tab") ui.tab = v;
    else if (act === "room") { ui.room = id; ui.replyOpen = null; }
    else if (act === "settings") ui.settings = !ui.settings;
    else if (act === "invite") ui.invite = !ui.invite;
    else if (act === "newroom") { ui.newRoom = !ui.newRoom; ui.newRoomName = ""; ui.newRoomPick = {}; }
    else if (act === "makeroom") {
      var nm = (ui.newRoomName || "").trim();
      if (!nm) { ui.msg = "部屋の名前を入れてください。"; render(); return; }
      var mem = {}; mem[me.uid] = true;
      Object.keys(ui.newRoomPick).forEach(function (u) { if (ui.newRoomPick[u]) mem[u] = true; });
      var rid = uid();
      rtdb.ref("rooms/" + rid).set({ name: nm, members: mem, board: EMPTY_BOARD })
        .then(function () {
          var up = {};
          Object.keys(mem).forEach(function (u) { up["members/" + u + "/rooms/" + rid] = true; });
          return rtdb.ref().update(up);
        })
        .then(function () { ui.room = rid; ui.newRoom = false; render(); })
        .catch(function (err) { ui.msg = "作れませんでした（" + err.code + "）"; render(); });
      return;
    }
    else if (act === "editroom") {
      var r = rooms[id];
      ui.newRoom = true; ui.newRoomName = r.name || ""; ui.newRoomPick = {};
      Object.keys(r.members || {}).forEach(function (u) { ui.newRoomPick[u] = true; });
      ui.editingRoom = id;
      ui.settings = false;
    }
    else if (act === "delroom") {
      var rr = rooms[id];
      if (!confirm("「" + (rr.name || "") + "」を消します。中身も消えます。よろしいですか？")) return;
      var upd = {}; upd["rooms/" + id] = null;
      Object.keys(rr.members || {}).forEach(function (u) { upd["members/" + u + "/rooms/" + id] = null; });
      rtdb.ref().update(upd).catch(function (err) { alert("消せませんでした（" + err.code + "）"); });
      return;
    }
    else if (act === "member") {
      var cur = members[id] || {};
      var next = cur.active === false;
      if (!next && !confirm((cur.name || cur.mail || id) + " を全部の部屋から締め出します。よろしいですか？")) return;
      rtdb.ref("members/" + id + "/active").set(next)
        .catch(function (err) { alert("変更できませんでした（" + err.code + "）"); });
      return;
    }
    else if (act === "doinvite") {
      var n = document.querySelector("#invName"), em = document.querySelector("#invMail"), pw = document.querySelector("#invPw");
      var nv = (n ? n.value : "").trim(), ev = (em ? em.value : "").trim(), pv = pw ? pw.value : "";
      if (!nv || !ev || pv.length < 6) { ui.msg = "名前・メール・6文字以上のパスワードを入れてください。"; render(); return; }
      var second = firebase.apps.filter(function (a) { return a.name === "invite"; })[0] ||
        firebase.initializeApp(FIREBASE_CONFIG, "invite");
      second.auth().createUserWithEmailAndPassword(ev, pv)
        .then(function (cred) {
          var u = cred.user.uid;
          return second.auth().signOut().then(function () {
            return rtdb.ref("members/" + u).set({ name: nv, mail: ev, role: "mgr", active: true });
          });
        })
        .then(function () { ui.invite = false; ui.msg = nv + " を登録しました。部屋に入れてください。"; render(); })
        .catch(function (err) {
          ui.msg = err.code === "auth/email-already-in-use" ? "そのメールアドレスは登録済みです。" :
            "登録できませんでした（" + err.code + "）";
          render();
        });
      return;
    }
    else if (act === "post") {
      var t = (ui.draft[list] || "").trim(); if (!t) return;
      arrFor(list).unshift({ id: uid(), text: t, by: me.uid, createdAt: now(), done: false, seenBy: {}, replies: [] });
      if (list.indexOf("fac:") === 0) { var f0 = fac(list.slice(4)); if (f0) f0.updatedAt = now(); }
      ui.draft[list] = ""; saveFor(list);
    }
    else if (act === "seen") {
      it = find(list, id);
      if (it) { it.seenBy = it.seenBy || {}; it.seenBy[me.uid] = true; saveFor(list); }
    }
    else if (act === "reply") { ui.replyOpen = ui.replyOpen === id ? null : id; ui.replyDraft = ""; }
    else if (act === "rsend") {
      var rv = (ui.replyDraft || "").trim(); if (!rv) return;
      it = find(list, id); if (!it) return;
      it.replies = toArr(it.replies);
      it.replies.push({ id: uid(), text: rv, by: me.uid, createdAt: now() });
      it.seenBy = it.seenBy || {}; it.seenBy[me.uid] = true;
      ui.replyOpen = null; ui.replyDraft = ""; saveFor(list);
    }
    else if (act === "del") {
      var target = find(list, id);
      var label = target ? (target.text || target.name || target.title || "") : "";
      if (label.length > 24) label = label.slice(0, 24) + "…";
      if (!confirm("「" + label + "」を削除します。元に戻せません。よろしいですか？")) return;
      setArr(list, arrFor(list).filter(function (x) { return x.id !== id; }));
      if (list === "facilities" && ui.pick === id) ui.pick = "";
      saveFor(list);
    }
    else if (act === "cycle") { it = fac(id); it.status = NEXT[it.status]; it.updatedAt = now(); saveField(); }
    else if (act === "bump") { it = find("cases", id); it.updatedAt = now(); saveField(); }
    else if (act === "finish") { it = find("cases", id); it.done = true; it.updatedAt = now(); saveField(); }
    else if (act === "talked") { it = find("staff", id); it.followedAt = now(); saveField(); }
    else if (act === "clearDone") { field.cases = field.cases.filter(function (c) { return !c.done; }); saveField(); }
    else if (act === "editlist") ui.editList = !ui.editList;
    else if (act === "addopen") { ui.addOpen = list; ui.addDraft = ""; ui.addPlace = ui.pick || ""; }
    else if (act === "addsend") {
      var av = (ui.addDraft || "").trim(); if (!av) return;
      if (list === "facilities") field.facilities.push({ id: uid(), name: av, status: "green", items: [], updatedAt: now() });
      if (list === "cases") field.cases.unshift({ id: uid(), title: av, place: ui.addPlace || "", next: "",
        createdAt: now(), updatedAt: now(), done: false });
      if (list === "staff") field.staff.push({ id: uid(), name: av, place: ui.addPlace || "", concern: "", followedAt: now() });
      ui.addOpen = null; ui.addDraft = ""; ui.addPlace = ""; saveField();
    }
    render();
  });

  /* 部屋の作り直し（編集） */
  document.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest('[data-act="makeroom"]') : null;
    if (!b || !ui.editingRoom) return;
    var rid = ui.editingRoom; ui.editingRoom = null;
    var mem = {}; mem[me.uid] = true;
    Object.keys(ui.newRoomPick).forEach(function (u) { if (ui.newRoomPick[u]) mem[u] = true; });
    var old = Object.keys((rooms[rid] || {}).members || {});
    var upd = {};
    upd["rooms/" + rid + "/name"] = (ui.newRoomName || "").trim() || rooms[rid].name;
    upd["rooms/" + rid + "/members"] = mem;
    old.forEach(function (u) { if (!mem[u]) upd["members/" + u + "/rooms/" + rid] = null; });
    Object.keys(mem).forEach(function (u) { upd["members/" + u + "/rooms/" + rid] = true; });
    rtdb.ref().update(upd).catch(function (err) { alert("変更できませんでした（" + err.code + "）"); });
  }, true);

  document.addEventListener("change", function (e) {
    var i = e.target;
    if (i.id === "pickSel") { captureDrafts(); ui.pick = i.value; render(); return; }
    if (i.id === "addPlace") { ui.addPlace = i.value; return; }
    if (i.hasAttribute && i.hasAttribute("data-pickuid")) {
      captureDrafts();
      ui.newRoomPick[i.getAttribute("data-pickuid")] = i.checked;
      return;
    }
    if (i.hasAttribute && i.hasAttribute("data-mname")) {
      rtdb.ref("members/" + i.getAttribute("data-mname") + "/name").set(i.value.trim());
      return;
    }
    if (i.hasAttribute && i.hasAttribute("data-cfg")) {
      rtdb.ref("config/" + i.getAttribute("data-cfg")).set(i.value.trim());
      return;
    }
    if (!i.hasAttribute || !i.hasAttribute("data-field")) return;
    var key = i.getAttribute("data-list");
    var o = find(key, i.getAttribute("data-id"));
    if (!o) return;
    o[i.getAttribute("data-field")] = i.value;
    saveFor(key);
    if (i.getAttribute("data-field") === "name") render();
  });

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    if (e.target.id === "mail" || e.target.id === "pw") {
      e.preventDefault();
      var ub = document.querySelector('button[data-act="login"]'); if (ub) ub.click();
      return;
    }
    if (e.target.id === "replyInput" || e.target.id === "addInput") {
      e.preventDefault();
      captureDrafts();
      var btn = e.target.parentNode.querySelector('button[data-act="rsend"], button[data-act="addsend"]');
      if (btn) btn.click();
    }
  });

  /* ドラッグで並べ替え */
  var drag = null;
  document.addEventListener("pointerdown", function (e) {
    var g = e.target.closest ? e.target.closest("[data-grip]") : null;
    if (!g) return;
    var item = g.closest(".item"); if (!item) return;
    e.preventDefault();
    captureDrafts();
    drag = { item: item, box: item.parentNode, list: item.getAttribute("data-list") };
    item.classList.add("dragging");
    document.body.style.userSelect = "none";
    try { g.setPointerCapture(e.pointerId); } catch (err) {}
  });
  document.addEventListener("pointermove", function (e) {
    if (!drag) return;
    e.preventDefault();
    var kids = Array.prototype.slice.call(drag.box.children);
    for (var i = 0; i < kids.length; i++) {
      var el = kids[i];
      if (el === drag.item) continue;
      var r = el.getBoundingClientRect();
      if (e.clientY < r.top + r.height / 2) {
        if (el.previousSibling !== drag.item) drag.box.insertBefore(drag.item, el);
        return;
      }
    }
    if (drag.box.lastChild !== drag.item) drag.box.appendChild(drag.item);
  });
  function endDrag() {
    if (!drag) return;
    var ids = Array.prototype.slice.call(drag.box.children).map(function (el) { return el.getAttribute("data-id"); });
    var arr = arrFor(drag.list);
    setArr(drag.list, ids.map(function (id) {
      return arr.filter(function (x) { return x.id === id; })[0];
    }).filter(Boolean));
    var k = drag.list;
    drag.item.classList.remove("dragging");
    drag = null;
    document.body.style.userSelect = "";
    saveFor(k); render();
  }
  document.addEventListener("pointerup", endDrag);
  document.addEventListener("pointercancel", endDrag);

  /* ---------- 起動 ---------- */
  function watchRoom(rid) {
    if (roomRefs[rid]) return;
    roomRefs[rid] = rtdb.ref("rooms/" + rid);
    roomRefs[rid].on("value", function (s) {
      var v = s.val();
      if (!v) { delete rooms[rid]; }
      else { v.board = normBoard(v.board); rooms[rid] = v; }
      render();
    }, function () { delete rooms[rid]; render(); });
  }
  function unwatchAll() {
    Object.keys(roomRefs).forEach(function (rid) { roomRefs[rid].off(); delete roomRefs[rid]; });
    rooms = {};
  }

  auth.onAuthStateChanged(function (u) {
    if (!u) { me = null; members = {}; unwatchAll(); render(); return; }
    rtdb.ref("members/" + u.uid).on("value", function (snap) {
      var m = snap.val();
      if (!m || m.active === false) {
        me = null; unwatchAll();
        ui.gateErr = "このアカウントは今このボードを見られません。";
        auth.signOut(); render(); return;
      }
      me = { uid: u.uid, role: m.role === "ceo" ? "ceo" : "mgr", name: m.name || "", mail: u.email };

      var wanted = Object.keys(m.rooms || {});
      Object.keys(roomRefs).forEach(function (rid) {
        if (wanted.indexOf(rid) < 0 && !isCeo()) { roomRefs[rid].off(); delete roomRefs[rid]; delete rooms[rid]; }
      });
      wanted.forEach(watchRoom);

      if (isCeo()) {
        rtdb.ref("rooms").on("value", function (s) {
          var v = s.val() || {};
          Object.keys(v).forEach(function (rid) { v[rid].board = normBoard(v[rid].board); });
          rooms = v; render();
        });
        rtdb.ref("members").on("value", function (s) { members = s.val() || {}; render(); });
      } else {
        rtdb.ref("members").on("value", function (s) { members = s.val() || {}; render(); }, function () {});
      }

      rtdb.ref("config").on("value", function (s) { conf = s.val() || { ceoName: "谷口" }; render(); });
      rtdb.ref("field").on("value", function (s) { field = normField(s.val()); render(); });
      render();
    }, function () {
      me = null; ui.gateErr = "このアカウントは今このボードを見られません。";
      auth.signOut(); render();
    });
  });

  render();
})();
</script>
</body>
</html>
