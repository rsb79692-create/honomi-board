       作ったらそのままクリップボードへ入れる（「作る」と「コピー」で2回押させない）。 */
    else if (act === "snew" || act === "sredo") {
      /* 二度押しで、誰にも渡していないリンクがもう1本できるのを止める */
      if (making) return;
      var srid = ui.room, oldSid = "";
      if (act === "sredo") {
        if (!okId(id) || !owns(shares, id)) return;
        if (!confirm("「" + (shares[id].name || "宛先なし") +
                     "」の共有リンクを作り直します。前に渡したURLは使えなくなります。よろしいですか？")) return;
        srid = shares[id].rid; oldSid = id;
      }
      if (!srid || !rooms[srid]) { ui.msg = "先に共有するボードを開いてください。"; render(); return; }
      var stk = newToken();
      if (!stk || !okToken(stk)) { ui.msg = "このブラウザでは共有リンクを作れません。"; render(); return; }
      var sf = document.querySelector("#shareName");
      var snm = act === "sredo" ? (shares[oldSid].name || "")
        : ((sf ? sf.value : ui.shareName) || "").trim().slice(0, 60);
      var nsid = uid(), su = {}, oldTk = oldSid && shares[oldSid] && shares[oldSid].token;
      /* 台帳を先に手元へ入れてから写しを組み立てる（sharePayload が shares を見るため） */
      shares[nsid] = { rid: srid, name: snm, token: stk, createdAt: now() };
      var sj = JSON.stringify(sharePayload(nsid));
      var spl = JSON.parse(sj); spl.updatedAt = now();
      if (oldSid) { su["shares/" + oldSid] = null; }
      if (okToken(oldTk)) { su["views/" + oldTk] = null; delete shareSent[oldTk]; }
      su["shares/" + nsid] = shares[nsid];
      su["views/" + stk] = spl;
      shareSent[stk] = sj;
      var prevOld = oldSid ? shares[oldSid] : null;
      if (oldSid) delete shares[oldSid];
      stopShareTimer();
      ui.showUrl = ""; ui.shareName = "";
      /* 入力欄の値も今すぐ空にする。render() の captureDrafts() が
         まだ差し替わっていない DOM から読み戻して、宛先名が残ってしまうため。 */
      if (sf) sf.value = "";
      /* ⚠ クリップボードは「押した操作」の流れの中でしか書けない（Safari）。
         DB の返事を待ってから書くと必ず失敗するので、ここで先に頼んでおく。 */
      making = true;
      var copying = clipWrite(viewUrl(stk));
      rtdb.ref().update(su)
        .then(function () {
          making = false;
          copying.then(function () {
            ui.showUrl = "";
            ui.msg = "共有リンクを作りました。コピーしたので、相手に送ってください。";
            render();
          }, function () {
            ui.showUrl = nsid;
            ui.msg = "共有リンクを作りました。コピーできなかったので、下に出たURLを写して送ってください。";
            render();
          });
          syncSharesSoon();
        })
        .catch(function (err) {
          /* 手元を元に戻す。戻さないと、DBに無いURLを渡してしまう */
          making = false;
          delete shareSent[stk]; delete shares[nsid];
          if (prevOld) shares[oldSid] = prevOld;
          syncSharesSoon();
          /* 先にコピーしてしまったURLは使えない。取り違えないよう必ず言う。 */
          ui.msg = "作れませんでした（" + ((err && err.code) || "原因不明") +
            "）。コピーされたURLは使えません。";
          render();
        });
      return;
    }
    else if (act === "sstop") {
      if (!okId(id) || !owns(shares, id)) return;
      if (!confirm("「" + (shares[id].name || "宛先なし") +
                   "」の共有をやめます。渡したURLは使えなくなります。よろしいですか？")) return;
      ui.showUrl = "";
      dropShare(id)
        .then(function () { ui.msg = "共有をやめました。渡したURLはもう読めません。"; render(); })
        .catch(function (err) {
          ui.msg = "止められませんでした（" + ((err && err.code) || "原因不明") + "）"; render();
        });
      return;
    }
    else if (act === "scopy") {
      if (!okId(id) || !owns(shares, id) || !okToken(shares[id].token)) return;
      copyLink(id, "リンクをコピーしました。相手に送ってください。");
      return;
    }
    else if (act === "doinvite") {
      var n = document.querySelector("#invName"), em = document.querySelector("#invMail"), pw = document.querySelector("#invPw");
      var nv = (n ? n.value : "").trim(), ev = (em ? em.value : "").trim(), pv = pw ? pw.value : "";
      if (!nv || !ev || pv.length < 6) { ui.msg = "名前・メール・6文字以上のパスワードを入れてください。"; render(); return; }
      var second = firebase.apps.filter(function (a) { return a.name === "invite"; })[0] ||
        firebase.initializeApp(FIREBASE_CONFIG, "invite");
      second.auth().createUserWithEmailAndPassword(ev, pv)
        .catch(function (err) {
          /* 一度削除した人を戻すときは、ログイン用のアカウントが残っているのでここへ来る。
             そのアカウントのパスワードが分かれば、UID を取り直して名簿へ入れ直せる。
             （UID を変えないので、部屋・閲覧リンクの紐付けも元どおりに作れる） */
          if (err && err.code === "auth/email-already-in-use") {
            return second.auth().signInWithEmailAndPassword(ev, pv);
          }
          throw err;
        })
        .then(function (cred) {
          var u = cred.user.uid;
          return second.auth().signOut().then(function () {
            return rtdb.ref("members/" + u).set({ name: nv, mail: ev, role: "mgr", active: true });
          });
        })
        .then(function () { ui.invite = false; ui.msg = nv + " を登録しました。部屋に入れてください。"; render(); })
        .catch(function (err) {
          ui.msg = /invalid-credential|wrong-password|user-not-found|invalid-login/.test(err.code)
            ? "そのメールアドレスは登録済みです。前に使っていたパスワードを入れると、同じ人として戻せます。" +
              "分からないときは、本人にログイン画面の「パスワードを忘れた」から再設定してもらってください。"
            : "登録できませんでした（" + err.code + "）";
          render();
        });
      return;
    }
    else if (act === "askdel") {
      var pk = pkOf(list, id);
      ui.confirmDel = ui.confirmDel === pk ? "" : pk;
    }
    else if (act === "fold") {
      var fk = b.getAttribute("data-fold");
      if (fk) { if (owns(ui.open, fk)) delete ui.open[fk]; else ui.open[fk] = true; }
    }
    else if (act === "nodel") { ui.confirmDel = ""; }
    else if (act === "dodel") {
      ui.confirmDel = "";
      var delRow = find(list, id);
      if (delRow && !canEditRow(list, delRow)) { render(); return; }
      setArr(list, arrFor(list).filter(function (x) { return !x || x.id !== id; }));
      if (edit && edit.pk === pkOf(list, id)) edit = null;
      delete ui.fresh[pkOf(list, id)];
      delete ui.open[pkOf(list, id)];
      saveFor(list, 0);
    }
    else if (act === "del") {
      var target = find(list, id);
      var label = target ? (target.text || target.name || target.title || "") : "";
      if (label.length > 24) label = label.slice(0, 24) + "…";
      if (!confirm("「" + label + "」を削除します。元に戻せません。よろしいですか？")) return;
      setArr(list, arrFor(list).filter(function (x) { return !x || x.id !== id; }));
      if (list === "facilities" && ui.pick === id) ui.pick = "";
      saveFor(list);
    }
    else if (act === "cycle") {
      it = fac(id); if (!it) return;
      it.status = NEXT[it.status] || "green"; it.updatedAt = now(); saveField("facilities");
    }
    else if (act === "talked") { it = find("staff", id); if (!it) return; it.followedAt = now(); saveField("staff"); }
    else if (act === "clearDone") {
      /* 画面に出ている範囲（施設の絞り込み込み）だけを消す */
      var inView = function (c) { return !ui.pick || c.place === ui.pick; };
      var doneN = field.cases.filter(function (c) { return stat(c) === "done" && inView(c); }).length;
      if (!doneN) return;
      if (!confirm("完了した課題 " + doneN + "件をまとめて消します。元に戻せません。よろしいですか？")) return;
      field.cases = field.cases.filter(function (c) { return !(stat(c) === "done" && inView(c)); });
      saveField("cases");
    }
    else if (act === "editlist") ui.editList = !ui.editList;
    else if (act === "addopen") { ui.addOpen = list; ui.addDraft = ""; ui.addPlace = ui.pick || ""; ui.focusAdd = true; }
    else if (act === "addsend") {
      var av = (ui.addDraft || "").trim(); if (!av) return;
      if (list === "facilities") field.facilities.push({ id: uid(), name: av, status: "green", items: [], updatedAt: now() });
      if (list === "cases") field.cases.unshift({ id: uid(), title: av, place: ui.addPlace || "",
        assignee: "", status: "todo", createdAt: now(), updatedAt: now(), done: false });
      if (list === "staff") field.staff.push({ id: uid(), name: av, place: ui.addPlace || "", concern: "", followedAt: now() });
      ui.addOpen = null; ui.addDraft = ""; ui.addPlace = ""; saveField(list);
    }
    render();
  });

  /* 部屋の作り直し（編集） */
  document.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest('[data-act="makeroom"]') : null;
    if (!b || !ui.editingRoom) return;
    var rid = ui.editingRoom; ui.editingRoom = null;
    if (!okId(rid) || !rooms[rid]) return;      /* 開いている間に消えていたら何もしない */
    var mem = {}; mem[me.uid] = true;
    Object.keys(ui.newRoomPick).forEach(function (u) {
      if (ui.newRoomPick[u] && owns(members, u)) mem[u] = true;
    });
    var old = Object.keys((rooms[rid] || {}).members || {});
    var upd = {};
    upd["rooms/" + rid + "/name"] = (ui.newRoomName || "").trim() || rooms[rid].name;
    upd["rooms/" + rid + "/members"] = mem;
    old.forEach(function (u) { if (!mem[u]) upd["members/" + u + "/rooms/" + rid] = null; });
    Object.keys(mem).forEach(function (u) { upd["members/" + u + "/rooms/" + rid] = true; });
    rtdb.ref().update(upd).catch(function (err) { alert("変更できませんでした（" + err.code + "）"); });
  }, true);

  document.addEventListener("change", function (e) {
    var i = e.target;
    if (i.id === "pickSel") { captureDrafts(); ui.pick = i.value; render(); return; }
    if (i.id === "addPlace") { ui.addPlace = i.value; return; }
    if (i.hasAttribute && i.hasAttribute("data-pickuid")) {
      captureDrafts();
      ui.newRoomPick[i.getAttribute("data-pickuid")] = i.checked;
      return;
    }
    if (i.hasAttribute && i.hasAttribute("data-mname")) {
      rtdb.ref("members/" + i.getAttribute("data-mname") + "/name").set(i.value.trim());
      return;
    }
    if (i.hasAttribute && i.hasAttribute("data-status")) {
      var c = find("cases", i.getAttribute("data-id"));
      if (!c) return;
      if (["todo", "doing", "done"].indexOf(i.value) < 0) return;
      c.status = i.value;
      /* done も併せて持つ。古い形しか見ない箇所と食い違わせないため。 */
      c.done = i.value === "done";
      c.updatedAt = now();
      saveField("cases");
      render();
      return;
    }
    if (i.hasAttribute && i.hasAttribute("data-cfg")) {
      rtdb.ref("config/" + i.getAttribute("data-cfg")).set(i.value.trim());
      return;
    }
    if (!i.hasAttribute || !i.hasAttribute("data-field")) return;
    if (!editableField(i.getAttribute("data-field"))) return;
    var key = i.getAttribute("data-list");
    var o = find(key, i.getAttribute("data-id"));
    if (!o) return;
    o[i.getAttribute("data-field")] = i.value;
    if (key === "cases") o.updatedAt = now();
    saveFor(key);
    if (i.getAttribute("data-field") === "name") render();
  });

  /* ---------- ノートの直接編集（自動保存） ---------- */
  function isBlk(t) {
    return t && t.classList && t.classList.contains("btxt") && t.tagName === "TEXTAREA";
  }
  var promoteWait = null;
  function typed(t) {
    grow(t);
    if (applyEdit(t.getAttribute("data-list"), t.getAttribute("data-id"), t.value)) promoteWait = t;
    /* 変換中に行を組み替えると入力が壊れうるので、確定してから作り替える */
    if (promoteWait && !composing()) { var p = promoteWait; promoteWait = null; promoteRow(p); }
  }
  document.addEventListener("input", function (e) {
    if (isBlk(e.target)) { typed(e.target); return; }
    /* 1行入力（課題の内容・担当など）も打った端から手元へ入れておく。
       離れるまで待つと、その間に届いた他の人の更新で画面が作り直されて打った字が消える。 */
    var t = e.target;
    if (!t.hasAttribute || !t.hasAttribute("data-field") || !t.hasAttribute("data-list")) return;
    if (!editableField(t.getAttribute("data-field"))) return;
    var k = t.getAttribute("data-list"), o = find(k, t.getAttribute("data-id"));
    if (!o) return;
    if (t.hasAttribute("title")) t.title = t.value;
    o[t.getAttribute("data-field")] = t.value;
    if (k === "cases") o.updatedAt = now();
    saveFor(k, 700);
  });
  document.addEventListener("compositionstart", function () { composeAt = Date.now(); });
  document.addEventListener("compositionupdate", function () { composeAt = Date.now(); });
  document.addEventListener("compositionend", function (e) {
    composeAt = 0;
    if (isBlk(e.target)) typed(e.target);
    if (pendingRender) render();
  });
  /* ここでは画面を作り直さない。
     作り直すと、押されたボタンが差し替わってクリックが取りこぼされる。 */
  document.addEventListener("focusout", function (e) {
    if (rendering || drag) return;
    var t = e.target;
    if (!isBlk(t)) return;
    composeAt = 0;                         /* 変換中に離れた場合の取りこぼし対策 */
    if (commitEdit()) {
      var blk = t.parentNode;              /* 空のまま終わった行だけ、その場で取り除く */
      if (blk && blk.parentNode) blk.parentNode.removeChild(blk);
    }
  });

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    if (e.target.id === "mail" || e.target.id === "pw") {
      e.preventDefault();
      var ub = document.querySelector('button[data-act="login"]'); if (ub) ub.click();
      return;
    }
    if (e.target.id === "addInput") {
      e.preventDefault();
      captureDrafts();
      var btn = e.target.parentNode.querySelector('button[data-act="addsend"]');
      if (btn) btn.click();
      return;
    }
    if (e.target.id === "shareName") {
      e.preventDefault();
      captureDrafts();
      var sb = document.querySelector('button[data-act="snew"]');
      if (sb) sb.click();
    }
  });

  /* ドラッグで並べ替え */
  var drag = null, dragFrom = null;
  function rowIds(box) {
    return Array.prototype.slice.call(box.children)
      .filter(function (el) { return !el.hasAttribute("data-new"); })
      .map(function (el) { return el.getAttribute("data-id"); });
  }
  document.addEventListener("pointerdown", function (e) {
    var g = e.target.closest ? e.target.closest("[data-grip]") : null;
    if (!g) return;
    var item = g.closest(".blk"); if (!item) return;
    e.preventDefault();
    /* つまんだだけ・触れただけでは動かさない。少し動かして初めて並べ替えを始める。 */
    dragFrom = { g: g, item: item, x: e.clientX, y: e.clientY, id: e.pointerId };
  });
  function startDrag() {
    var d = dragFrom; dragFrom = null;
    captureDrafts();
    drag = { item: d.item, box: d.item.parentNode,
             list: d.item.getAttribute("data-list"),
             was: rowIds(d.item.parentNode).join("\u0001") };
    d.item.classList.add("dragging");
    document.body.style.userSelect = "none";
    try { d.g.setPointerCapture(d.id); } catch (err) {}
  }
  document.addEventListener("pointermove", function (e) {
    if (dragFrom) {
      /* 離したことを取りこぼしていたら、つかみかけを捨てる */
      if (e.buttons === 0 && e.pointerType === "mouse") { dragFrom = null; return; }
      if (Math.abs(e.clientY - dragFrom.y) < 8 && Math.abs(e.clientX - dragFrom.x) < 8) return;
      startDrag();
    }
    if (!drag) return;
    e.preventDefault();
    var kids = Array.prototype.slice.call(drag.box.children);
    var tail = drag.box.querySelector("[data-new]");
    for (var i = 0; i < kids.length; i++) {
      var el = kids[i];
      if (el === drag.item || el === tail) continue;
      var r = el.getBoundingClientRect();
      if (e.clientY < r.top + r.height / 2) {
        if (el.previousSibling !== drag.item) drag.box.insertBefore(drag.item, el);
        return;
      }
    }
    /* 末尾の入力欄より下へは置かない */
    if (tail) { if (tail.previousSibling !== drag.item) drag.box.insertBefore(drag.item, tail); }
    else if (drag.box.lastChild !== drag.item) drag.box.appendChild(drag.item);
  });
  function endDrag() {
    if (dragFrom) { dragFrom = null; return; }   /* 動かさずに離した＝並べ替えではない */
    if (!drag) return;
    var k = drag.list, was = drag.was, ids = rowIds(drag.box);
    drag.item.classList.remove("dragging");
    drag = null;
    document.body.style.userSelect = "";
    var arr = arrFor(k), seen = {}, ok = ids.length === arr.length;
    ids.forEach(function (id) { if (seen[id]) ok = false; seen[id] = 1; });
    if (ok) {
      var next = ids.map(function (id) {
        return arr.filter(function (x) { return x && x.id === id; })[0];
      });
      /* 画面と中身の対応が取れたときだけ確定する（並べ替えで行を失わない） */
      if (next.indexOf(undefined) < 0 && ids.join("\u0001") !== was) {
        setArr(k, next);
        saveFor(k, 0);
      }
    }
    render();
  }
  document.addEventListener("pointerup", endDrag);
  document.addEventListener("pointercancel", endDrag);
  /* タブを閉じる・背面へ回すときは、書きかけを出しきる */
  window.addEventListener("pagehide", function () { flushSaves(); flushShares(); });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { flushSaves(); flushShares(); }
  });
  document.addEventListener("pointerdown", function () { heldAt = Date.now(); }, true);
  function released() {
    heldAt = 0;
    if (pendingRender) setTimeout(render, 0);   /* click を先に通してから描き直す */
  }
  /* pointerup を取りこぼしても、待たせた描き直しが残らないようにする */
  setInterval(function () {
    if (!me) { if (pendingRender && !held()) render(); return; }
    if (pendingRender && !held() && !drag && !composing()) render();
  }, 1000);
  document.addEventListener("pointerup", released, true);
  document.addEventListener("pointercancel", released, true);

  /* ---------- 起動 ---------- */
  function watchRoom(rid) {
    if (roomRefs[rid]) return;
    roomRefs[rid] = rtdb.ref("rooms/" + rid);
    roomRefs[rid].on("value", function (s) {
      var v = s.val();
      if (!v) { if (!rooms[rid]) return; delete rooms[rid]; }
      else {
        v.board = keepEditing(rooms[rid] && rooms[rid].board, normBoard(v.board));
        if (same(v, rooms[rid])) return;
        rooms[rid] = v;
      }
      render();
    }, function () { if (!rooms[rid]) return; delete rooms[rid]; render(); });
  }
  function unwatchAll() {
    Object.keys(roomRefs).forEach(function (rid) { roomRefs[rid].off(); delete roomRefs[rid]; });
    rooms = {};
  }

  auth.onAuthStateChanged(function (u) {
    ui.saving = ""; failed = {}; failMsg = "";
    if (!u) {
      me = null; members = {};
      gotRooms = false; gotMembers = false; ui.open = {};
      ui.share = false; ui.showUrl = ""; ui.shareName = "";
      stopShareTimer(); dropShareSub(); unwatchAll(); render(); return;
    }
    rtdb.ref("members/" + u.uid).on("value", function (snap) {
      var m = snap.val();
      if (!m || m.active === false) {
        me = null; unwatchAll();
        ui.gateErr = "このアカウントは今このボードを見られません。";
        auth.signOut(); render(); return;
      }
      me = { uid: u.uid, role: m.role === "ceo" ? "ceo" : "mgr", name: m.name || "", mail: u.email };

      var wanted = Object.keys(m.rooms || {});
      Object.keys(roomRefs).forEach(function (rid) {
        if (wanted.indexOf(rid) < 0 && !isCeo()) { roomRefs[rid].off(); delete roomRefs[rid]; delete rooms[rid]; }
      });
      wanted.forEach(watchRoom);

      if (isCeo()) {
        rtdb.ref("rooms").on("value", function (s) {
          var v = s.val() || {};
          Object.keys(v).forEach(function (rid) {
            v[rid].board = keepEditing(rooms[rid] && rooms[rid].board, normBoard(v[rid].board));
          });
          gotRooms = true;
          if (same(v, rooms)) { migrateLinks(); syncSharesSoon(); return; }
          rooms = v; migrateLinks(); syncSharesSoon(); render();
        }, function (e) {
          /* ここが黙って落ちると gotRooms が立たず、共有リンクの中身が
             未来永劫更新されない（消した行が残り続ける）。必ず知らせる。 */
          ui.msg = "ボードを読めませんでした（" + ((e && (e.code || e.message)) || "原因不明") +
            "）。共有リンクの中身は更新されません。開き直してください。";
          render();
        });
        rtdb.ref("members").on("value", function (s) {
          members = s.val() || {}; gotMembers = true;
          migrateLinks(); syncSharesSoon(); render();
        });
        /* 台帳は社長だけが読み書きする。ここを members に置くと、
           ほかの利用者が人のあいことばを読めてしまう。 */
        if (!shareRef) {
          shareRef = rtdb.ref("shares");
          shareRef.on("value", function (s) {
            shares = s.val() || {};
            sweepViews(); syncSharesSoon(); render();
          }, function (e) {
            shares = {};
            ui.msg = "共有リンクの一覧を読めませんでした（" +
              ((e && (e.code || e.message)) || "原因不明") + "）。このまま新しく作ると、前のURLが残ります。";
            render();
          });
        }
        /* 旧「利用者ごとの閲覧リンク」。移行のためだけに読む。
           移行が終われば空になり、以後この購読は何もしない。 */
        if (!legacyRef) {
          legacyRef = rtdb.ref("viewLinks");
          legacyRef.on("value", function (s) {
            legacyLinks = s.val() || {};
            migrateLinks();
          }, function () { legacyLinks = {}; });
        }
      } else {
        dropShareSub();
        rtdb.ref("members").on("value", function (s) { members = s.val() || {}; render(); }, function () {});
      }

      rtdb.ref("config").on("value", function (s) {
        conf = s.val() || { ceoName: "谷口" }; syncSharesSoon(); render();
      });
      rtdb.ref("field").on("value", function (s) {
        var v = normField(s.val());
        if (same(v, field)) return;
        field = v; render();
      });
      render();
    }, function () {
      me = null; ui.gateErr = "このアカウントは今このボードを見られません。";
      auth.signOut(); render();
    });
  });

  render();
})();
</script>
</body>
</html>
