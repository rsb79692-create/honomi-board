<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>穂乃味ボード</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --paper:#E7E9E2; --surface:#FCFCFA; --ink:#1D2226; --ink2:#5E666C; --ink3:#8D9499;
    --line:#D3D6CB; --ceo:#2E4A6B; --mgr:#55457A; --ok:#4C8055; --warn:#C88F1E; --bad:#B8443A;
  }
  /* textarea の高さを測る一瞬にスクロールバーが出入りすると本文幅が変わり、
     行数を読み違えて最後の行が切れる。バーの幅を常に確保しておく。 */
  html { scrollbar-gutter: stable; }
  html, body { margin:0; padding:0; background:var(--paper); }
  body { font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic","Meiryo",sans-serif;
    color:var(--ink); -webkit-font-smoothing:antialiased; padding-bottom:48px; }
  #app { max-width:640px; margin:0 auto; }
  /* 共有ボードだけ左右2列にするので広くする。他のタブは今までどおりの幅。 */
  #app.wide { max-width:920px; }
  button { font-family:inherit; cursor:pointer; }
  :focus-visible { outline:2px solid var(--ceo); outline-offset:2px; }

  .gate { padding:60px 20px; max-width:360px; margin:0 auto; }
  .gate h1 { font-size:19px; margin:0 0 6px; letter-spacing:.04em; }
  .gate p { font-size:13px; color:var(--ink2); line-height:1.7; margin:0 0 20px; }
  .gate input { width:100%; padding:12px; font-size:16px; font-family:inherit; border:1px solid var(--line);
    border-radius:3px; background:var(--surface); color:var(--ink); }
  .gate button { width:100%; margin-top:10px; padding:12px; font-size:14px; font-weight:600; border:0;
    border-radius:3px; background:var(--ink); color:#fff; }
  .gate .err { color:var(--bad); font-size:13px; margin-top:10px; }

  .top { padding:14px 14px 0; }
  .brand { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .name { font-size:17px; font-weight:700; letter-spacing:.04em; margin:0; }
  .sub { font-size:11px; color:var(--ink3); }
  .whoami { display:flex; align-items:center; gap:10px; margin-top:8px; font-size:12px; color:var(--ink2); }
  .whoami .tagme { font-weight:700; color:#fff; padding:3px 9px; border-radius:3px; font-size:12px; }
  .whoami button { background:none; border:0; font-size:12px; color:var(--ink3); padding:0; }

  .rooms { display:flex; gap:6px; margin-top:12px; overflow-x:auto; padding-bottom:2px; }
  .rooms button { flex:none; padding:7px 13px; font-size:13px; font-weight:600; border:1px solid var(--line);
    border-radius:20px; background:transparent; color:var(--ink2); display:flex; align-items:center; gap:6px; }
  .rooms button[data-on="1"] { background:var(--ink); border-color:var(--ink); color:#fff; }
  .rooms .plus { font-weight:400; color:var(--ink3); }

  .tabs { display:flex; margin-top:14px; border-bottom:1px solid var(--line); }
  .tabs button { flex:1; padding:11px 0 9px; background:none; border:0; border-bottom:2px solid transparent;
    font-size:14px; font-weight:600; color:var(--ink3); margin-bottom:-1px;
    display:flex; align-items:center; justify-content:center; gap:6px; }
  .tabs button[data-on="1"] { color:var(--ink); border-bottom-color:var(--ink); }
  /* 共有は「今開いているボード」への操作。タブの並びに置くが、切り替えではないので幅を詰める。 */
  .tabs button.shr { flex:0 0 auto; padding-left:14px; padding-right:14px; }
  .tabs button.shr .badge { background:var(--ink3); }
  .badge { min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--bad); color:#fff;
    font-size:11px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; }

  .body { padding:4px 14px 0; }
  .notice { margin-top:14px; border:1px solid var(--warn); border-radius:4px; background:var(--surface);
    padding:10px 12px; font-size:13px; line-height:1.7; color:var(--ink2); }
  /* 共有ボード。役割ごとに4枚を、ビジョン → タスク → アウトプット → 相談 の順に並べる。
     左右の意味は入れ替えない（どの欄を誰が書くかは役割で決まっている）。 */
  .cards { display:grid; grid-template-columns:1fr 1fr; gap:20px 22px; margin-top:10px; align-items:start; }
  .card { min-width:0; border-left:3px solid var(--line); padding-left:11px; }
  .card[data-v="ceo"] { border-left-color:var(--ceo); }
  .card[data-v="mgr"] { border-left-color:var(--mgr); }
  .card[data-v="both"] { border-left-color:var(--ink2); }
  .card-h { display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; padding-bottom:2px; }
  .card-t { font-size:17px; font-weight:700; margin:0; }
  .card-w { font-size:11px; color:var(--ink2); }
  .card-w .ro { margin-left:4px; }
  @media (max-width:719px) { .cards { grid-template-columns:1fr; gap:20px; } }

  /* ビジョンは一覧性を優先して1行だけ出す。押すと全文、もう一度押すと1行へ戻る。 */
  .btxt.foldable { cursor:pointer; }
  .btxt.clip { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* × と取り違えないよう、色を濃くして間隔をあける（× は消す＝赤、こちらは表示の切り替え） */
  .blk .fold { flex:none; align-self:flex-start; margin:9px 10px 0 0; min-width:30px; height:30px;
    border:0; border-radius:3px; background:transparent; color:var(--ink2); font-size:15px;
    line-height:1; padding:0; }
  .blk .fold:hover { background:#F1F2EC; color:var(--ink); }
  /* 「だれが・いつ」。行の下へ小さく折り返す。 */
  .meta { flex:0 0 100%; padding:0 10px 8px 32px; font-size:11px; color:var(--ink2); }
  .meta .other { font-weight:700; color:var(--ink); }

  .sec { margin-top:20px; border-left:3px solid var(--line); padding-left:11px; }
  .sec-h { display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .sec-t { font-size:17px; font-weight:700; margin:0; }
  .sec-n { font-size:11px; color:var(--ink3); }
  .sec-d { font-size:12px; color:var(--ink2); margin:3px 0 10px; line-height:1.6; }

  .send { margin-left:auto; padding:6px 14px; font-size:13px; font-weight:600; border:0; border-radius:3px;
    background:var(--ink); color:#fff; }
  .send.plain { margin-left:0; }

  /* 1項目＝1枚のノート。中身は複数ブロック。 */
  .note { background:var(--surface); border:1px solid var(--line); border-radius:4px; margin-top:8px; }
  .blk { display:flex; align-items:flex-start; flex-wrap:wrap; }
  .blk + .blk { border-top:1px solid #E2E4DC; }
  .blk:focus-within { background:#F1F2EC; box-shadow:inset 3px 0 0 var(--ceo); }
  .card[data-v="mgr"] .blk:focus-within { box-shadow:inset 3px 0 0 var(--mgr); }
  .card[data-v="both"] .blk:focus-within { box-shadow:inset 3px 0 0 var(--ink2); }
  .blk.dragging { opacity:.4; }
  .grip { flex:none; align-self:stretch; width:32px; min-height:44px; border:0; background:transparent;
    padding:0; color:var(--ink3); font-size:15px; line-height:1; cursor:grab; touch-action:none;
    border-radius:3px 0 0 3px; }
  .grip:hover { color:var(--ink); background:#F1F2EC; }
  .grip:active { cursor:grabbing; }
  .grip.ghost { cursor:default; }
  .btxt { flex:1; min-width:0; display:block; width:100%; margin:0; border:0; background:transparent;
    font-family:inherit; font-size:16px; line-height:1.75; color:var(--ink); padding:10px 6px 10px 0;
    resize:none; overflow:hidden; white-space:pre-wrap; word-break:break-word; }
  .btxt:focus { outline:none; }
  .btxt::placeholder { color:var(--ink3); }
  .bx { flex:none; align-self:flex-start; margin:9px 4px 0 0; min-width:30px; height:30px; border:0;
    border-radius:3px; background:transparent; color:var(--ink3); font-size:15px; line-height:1; padding:0; }
  .blk .bx:hover { background:#F1F2EC; color:var(--bad); }
  /* 消す確認は行の下へ折り返して出す（本文の幅を変えず、押す位置がずれないように） */
  .ask { flex:0 0 100%; display:flex; align-items:center; gap:14px; padding:0 10px 10px 32px;
    font-size:12px; color:var(--ink2); }
  .ask button { border:0; background:none; padding:3px 6px; font-size:12px; font-weight:700; color:var(--bad); }
  .ask button.no { color:var(--ink3); font-weight:400; }
  .empty { font-size:13px; color:var(--ink2); line-height:1.7; padding:12px 0 2px; margin:0; }
  .note .empty { padding:12px 14px; }
  /* 現場マネジメントの「＋追加」で出る入力行 */
  .rin { display:flex; gap:6px; margin-top:8px; }
  .rin input { flex:1; min-width:0; border:1px solid var(--line); border-radius:3px; padding:8px 9px; font-size:16px;
    font-family:inherit; background:var(--surface); color:var(--ink); }
  @media (max-width:480px) {
    .vline { gap:12px; }
    .vline button { min-height:44px; padding:0 14px; }
    .grip { width:44px; }
    .bx, .blk .fold { min-width:44px; height:44px; margin-top:4px; }
    .ask { padding-left:44px; gap:18px; }
    .meta { padding-left:44px; }
    .ask button { min-height:44px; padding:0 12px; }
  }

  .alert { margin-top:14px; border:1px solid var(--bad); border-radius:4px; background:var(--surface); overflow:hidden; }
  .alert-h { padding:9px 12px; font-size:13px; font-weight:700; color:var(--bad); border-bottom:1px solid var(--line); }
  .alert ul { margin:0; padding:8px 12px 10px 26px; }
  .alert li { font-size:13px; line-height:1.75; }

  .pick { display:flex; align-items:center; gap:8px; margin-top:14px; }
  .pick select { flex:1; font-family:inherit; font-size:15px; font-weight:600; padding:10px;
    border:1px solid var(--line); border-radius:3px; background:var(--surface); color:var(--ink); }
  .pick button { background:none; border:0; font-size:12px; color:var(--ink3); padding:0; white-space:nowrap; }

  /* 共有ボードのときだけ #app が広くなるが、設定・部屋作成のパネルは広げない。
     名前と「削除」が離れすぎて、行を取り違えて押す事故を防ぐため。 */
  /* 共有ボードのときだけ #app が広くなるが、設定・部屋作成のパネルは広げない。
     名前と「削除」が離れすぎて、行を取り違えて押す事故を防ぐため。
     幅は狭いほうのタブ（#app 640px の内寸）へ合わせる。タブで幅が変わると、
     閲覧リンクの行が片方でだけ折り返して、誰のリンクか分からなくなる。 */
  .panel { margin-top:10px; border:1px solid var(--line); border-radius:4px; background:var(--surface);
    padding:12px; max-width:612px; }
  .panel h3 { margin:0 0 4px; font-size:13px; font-weight:700; }
  .panel p { margin:0 0 8px; font-size:12px; color:var(--ink2); line-height:1.7; }
  .pline { display:flex; gap:8px; align-items:center; padding:7px 0; border-top:1px solid var(--line); }
  .pline:first-of-type { border-top:0; }
  .pline input[type="text"], .pline input:not([type]) { flex:1; border:0; border-bottom:1px dashed var(--line);
    background:transparent; font-family:inherit; font-size:14px; padding:3px 0; color:var(--ink); }
  .pline input:focus { outline:none; border-bottom-color:var(--ink); }
  /* 押せるボタンと、押せない状態表示（.pnote）が同じ見た目にならないようにする。
     ホバーで色が変わることと、指で押せる大きさを持たせることで見分けが付く。 */
  .pline button { background:none; border:0; font-size:12px; color:var(--ink3);
    padding:4px 6px; min-height:26px; border-radius:3px; }
  .pline button:hover { color:var(--ink); background:#F1F2EC; }
  /* 同じ人のブロックの中で、押す大きさがちぐはぐにならないようにする。
     この指定は .pline button の定義より後ろに置くこと（前に置くと上書きされる）。 */
  @media (max-width:480px) {
    .pline button { min-height:44px; padding:0 10px; }
  }
  .pname { flex:1; font-size:14px; }
  .pnote { font-size:11px; color:var(--ink3); }
  .chk { display:flex; align-items:center; gap:8px; padding:6px 0; font-size:14px; }
  .chk input { width:18px; height:18px; }
  .field { margin-top:12px; }
  .field label { display:block; font-size:12px; font-weight:700; margin-bottom:4px; }
  .field input { width:100%; padding:9px; font-size:14px; font-family:inherit; border:1px solid var(--line);
    border-radius:3px; background:var(--paper); color:var(--ink); }
  .btn { margin-top:10px; padding:9px 14px; font-size:13px; font-weight:600; border:0; border-radius:3px;
    background:var(--ink); color:#fff; }
  .btn.ghost { background:transparent; color:var(--ink2); border:1px solid var(--line); }

  .fac { background:var(--surface); border:1px solid var(--line); border-radius:4px; margin-top:12px; overflow:hidden; }
  .fac-h { display:flex; align-items:center; gap:10px; padding:11px 12px; border-bottom:1px solid var(--line); }
  .dot { width:16px; height:16px; border-radius:50%; flex:none; border:0; padding:0; }
  .fac-n { font-size:17px; font-weight:700; flex:1; }
  .fac-d { font-size:11px; color:var(--ink3); }
  .fac .note { border:0; border-radius:0; margin:0; }
  .fac .hint { margin:0; padding:8px 12px 0; font-size:12px; color:var(--ink2); line-height:1.6; }
  .card .hint { margin:0; padding:6px 0 0; font-size:12px; color:var(--ink2); line-height:1.6; }

  /* 課題・対応事項の一覧。内容・担当・状態だけ。 */
  .tasks { background:var(--surface); border:1px solid var(--line); border-radius:4px; margin-top:8px; }
  .thead, .task { display:grid; grid-template-columns:1fr 108px 92px 30px; gap:0 10px; align-items:center;
    padding:7px 10px; }
  .thead { font-size:11px; color:var(--ink3); border-bottom:1px solid var(--line); }
  .task + .task { border-top:1px solid #E2E4DC; }
  .task.is-done .t-in { color:var(--ink3); }
  .task .tag { grid-column:1 / -1; padding-bottom:2px; }
  /* 収まらないときは「…」で切れていることを示す。全文は title（ホバー）と、
     その欄を選んだときのスクロールで読める。 */
  .t-in { width:100%; min-width:0; border:0; border-bottom:1px dashed transparent; background:transparent;
    font-family:inherit; font-size:14px; line-height:1.6; color:var(--ink); padding:4px 0;
    text-overflow:ellipsis; }
  .t-in:focus { outline:none; border-bottom-color:var(--ink); }
  .t-in::placeholder { color:var(--ink3); }
  .t-st { font-family:inherit; font-size:12px; padding:5px 2px; border:1px solid var(--line);
    border-radius:3px; background:var(--paper); color:var(--ink); }
  .t-del { border:0; background:none; padding:0; font-size:14px; color:var(--ink3); }
  .t-del:hover { color:var(--bad); }
  @media (max-width:560px) {
    .thead { display:none; }
    /* スマホは縦に折り返す。内容を1行使い、その下に担当・状態・削除を並べる。 */
    .task { display:flex; flex-wrap:wrap; align-items:center; gap:5px 10px; padding:9px 10px; }
    .task .tag { flex:1 1 100%; }
    .t-name { flex:1 1 100%; }
    .t-who { flex:1 1 90px; min-width:0; }
    .t-st { flex:0 0 auto; min-height:36px; }
    .t-del { flex:0 0 30px; min-height:36px; }
    /* iOS は 16px 未満の入力へ触れると勝手に拡大する。狭い画面では 16px にする。 */
    .t-in { font-size:16px; }
  }
  @media (max-width:480px) {
    /* ノートの × や ⣿ と同じ大きさに揃える */
    .t-st { min-height:44px; }
    .t-del { flex:0 0 44px; min-height:44px; }
  }

  .row { background:var(--surface); border:1px solid var(--line); border-radius:4px; margin-top:8px; padding:10px 12px; }
  .row.stale { border-color:var(--bad); }
  .row-h { display:flex; align-items:center; gap:10px; }
  .row-n { font-size:14px; font-weight:700; flex:1; }
  .row-d { font-size:11px; color:var(--ink3); }
  .flag { font-size:11px; font-weight:700; color:var(--bad); }
  .tag { font-size:11px; color:var(--ink3); }
  .inline { width:100%; margin-top:7px; border:0; border-bottom:1px dashed var(--line); background:transparent;
    font-family:inherit; font-size:13px; line-height:1.6; color:var(--ink2); padding:3px 0; }
  .inline:focus { outline:none; border-bottom-color:var(--ink); color:var(--ink); }
  .acts { display:flex; gap:14px; margin-top:9px; align-items:center; }
  .acts button { background:none; border:0; padding:0; font-size:12px; color:var(--ink2); font-weight:600; }
  .acts .del { margin-left:auto; color:var(--ink3); font-weight:400; }
  .add { width:100%; margin-top:8px; padding:9px; border:1px dashed var(--line); border-radius:4px;
    background:transparent; font-size:13px; color:var(--ink2); font-weight:600; }
  /* ボードごとの共有リンク（1行＝渡した相手1人） */
  .vline { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:9px 0;
    border-top:1px solid var(--line); }
  .vline:first-of-type { border-top:0; }
  .vline .pname { flex:0 1 auto; min-width:0; font-size:14px; font-weight:600;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .vline .pnote { flex:1 1 auto; min-width:0; font-size:12px; color:var(--ink2); }
  .vline button { border:1px solid var(--line); background:var(--surface); border-radius:3px;
    padding:6px 11px; font-size:12px; color:var(--ink2); }
  .vline button.go { border-color:var(--ink); background:var(--ink); color:#fff; font-weight:600; }
  .vline button.stop { color:var(--bad); }
  .vurl { flex:1 1 100%; min-width:0; font-family:inherit; font-size:12px; padding:7px 8px;
    border:1px solid var(--line); border-radius:3px; background:var(--surface); color:var(--ink2); }

  .foot { margin-top:26px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  .foot button { background:none; border:0; font-size:12px; color:var(--ink3); padding:0; }
</style>
</head>
<body>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>

var FIREBASE_CONFIG = {
  apiKey: "AIzaSyDkYQ5d8mskHo94WIysaFYP8VT2bIZ9Vtc",
  authDomain: "honomi-timecard.firebaseapp.com",
  databaseURL: "https://honomi-timecard-default-rtdb.asia-southeast1.firebasedatabase.app",

<script>
(function () {
  firebase.initializeApp(FIREBASE_CONFIG);
  var auth = firebase.auth(), rtdb = firebase.database();
  var DAY = 86400000;
  var STATUS = { green: "var(--ok)", yellow: "var(--warn)", red: "var(--bad)" };
  var NEXT = { green: "yellow", yellow: "red", red: "green" };
  var EMPTY_BOARD = { ceoMind: [], toCeo: [], mgrAsk: [], toManager: [] };
  var EMPTY_FIELD = { facilities: [], staff: [], cases: [] };

  var me = null;                 /* {uid, role, name, mail} */
  var conf = { ceoName: "谷口" };
  var members = {};              /* uid -> {name, mail, role, active} */
  var rooms = {};                /* rid -> {name, members:{uid:true}, board:{}} */
  var field = JSON.parse(JSON.stringify(EMPTY_FIELD));
  var roomRefs = {}, saveTimers = {}, savePend = {}, failed = {}, failMsg = "";
  /* 共有リンク（社長だけが扱う）
       shares/{sid}  = {rid, name, token, createdAt} … どのボードを誰へ渡したかの台帳
       views/{token} = {sid, who, rooms:[…]}          … その相手に見せる中身の写し
     shareSent は「最後に書いた中身」。同じものを何度も書かないための控え。
     旧 viewLinks/{uid}（利用者ごとの閲覧リンク）は shares へ移して廃止する。
     ただし渡し済みのURLを生かすため、token はそのまま引き継ぐ。 */
  var shares = {}, shareSent = {}, shareTimer = null, shareRef = null;
  var making = false;            /* 共有リンクを作っている最中（二度押し止め） */
  var legacyLinks = {}, legacyRef = null, migrated = false;
  var gotRooms = false, gotMembers = false;   /* 部屋と名簿の初回が届いたか */

  var ui = { tab: "board", room: "", saving: "",
             newId: {}, confirmDel: "", fresh: {}, focusAdd: false, open: {},
             addOpen: null, addDraft: "", addPlace: "", pick: "", editList: false,
             settings: false, newRoom: false, newRoomName: "", newRoomPick: {},
             invite: false, gateErr: "", msg: "", showUrl: "",
             share: false, shareName: "" };

  /* 直接編集中の1行。DBの往復で入力中の文字が巻き戻らないように上書き表示する。 */
  var edit = null;              /* { pk, val, live } */
  /* 日本語入力（IME）変換中は描き直さない。
     compositionend を取りこぼしても止まったままにならないよう、時間で失効させる。 */
  var composeAt = 0;
  function composing() { return composeAt !== 0 && Date.now() - composeAt < 10000; }
  var pendingRender = false, rendering = false;
  /* ボタンを押している最中に画面を作り直すと、その操作が取りこぼされる。
     指・マウスを離すまで描き直しを待たせる（1秒で自動的に解除する）。 */
  var heldAt = 0;
  function held() { return heldAt !== 0 && Date.now() - heldAt < 1000; }

  var isCeo = function () { return me && me.role === "ceo"; };
  /* obj[key] は constructor などの継承分でも真になる。名簿の判定は必ずこれを通す。 */
  function owns(o, k) { return !!o && Object.prototype.hasOwnProperty.call(o, k); }
  function nameOfUid(u) {
    if (me && u === me.uid) return me.name || "自分";
    /* obj[key] は constructor などの継承分でも真になる。必ず owns() を通す */
    var m = owns(members, u) ? members[u] : null;
    return (m && m.name) || "だれか";
  }
  function room() { return rooms[ui.room] || null; }
  function board() {
    var r = room();
    /* 部屋が無いときに共有の定数を返すと、書き換えが全部屋へ波及する */
    if (!r) return JSON.parse(JSON.stringify(EMPTY_BOARD));
    if (!r.board) r.board = JSON.parse(JSON.stringify(EMPTY_BOARD));
    return r.board;
  }
  function myRooms() {
    return Object.keys(rooms).sort(function (a, b) {
      return (rooms[a].name || "").localeCompare(rooms[b].name || "");
    });
  }
  /* 経営ボード＝自分ひとりのボード（旧「社長の一人部屋」）。
     ボードの持ち主が自分だけ、というだけの区別で、閲覧共有とは別の話。
     共有リンクを渡しても経営ボードのままで、相手はメンバーにならない。 */
  function isSoloRoom(rid) {
    var r = rooms[rid];
    if (!r || !me) return false;
    var ms = Object.keys(r.members || {}).filter(function (u) {
      return r.members[u] === true;
    });
    return ms.length <= 1 && ms.indexOf(me.uid) >= 0;
  }
  function roomLabel(rid) {
    var r = rooms[rid];
    return (r && r.name) || (isSoloRoom(rid) ? "経営ボード" : "名前なし");
  }

  /* この部屋にいる「自分以外」の相手の名前。
     wantCeo=true → 社長側、false → 現場側。見出しを閲覧者から見た向きにするために使う。 */
  function partyLabel(wantCeo) {
    var r = room(), ns = [];
    if (r && me) {
      Object.keys(r.members || {}).forEach(function (u) {
        if (u === me.uid) return;
        var m = members[u];
        var isC = !!(m && m.role === "ceo");
        if (isC !== !!wantCeo) return;
        var n = (m && m.name) || (isC ? (conf.ceoName || "") : "");
        if (n) ns.push(n + "さん");
      });
    }
    /* 名簿が読めなかったときの保険（社長名は config にも持っている） */
    if (!ns.length && wantCeo && conf.ceoName) ns.push(conf.ceoName + "さん");
    return ns.join("、");
  }

  /* 共有ボードは1つの画面。役割ごとに4枚を並べる。
     どの欄を誰が書くかは**欄で決まっている**ので、見る人によって左右が入れ替わることはない。

       ビジョン    ceoMind    社長が書く → 現場が読む。1行に畳んで一覧性を優先する
       タスク      toManager  現場が書く → 社長が読む（旧「指針」）
       アウトプット toCeo      社長が書く → 現場が読む（旧「報告」）
       やりとり    mgrAsk     社長・現場の**どちらも**書く／読む（旧「相談」）。
                              相談・確認・質問・連絡・意見交換の場

     ⚠ DB のキーは旧名のまま。表示名だけを変えている（既存データをそのまま見せるため）。
     キーを変えると本番の既存データが読めなくなるので、改名してはならない。 */
  function cards() {
    var ceo = isCeo();
    /* 見出しの右に出す一言。助詞までここで作る（「が書く」を後ろで足すと
       「あなたも相手もが書く」のように助詞が重なる）。 */
    var ceoWho = ceo ? "あなたが書く" : (partyLabel(true) || "社長") + "が書く";
    /* 経営ボード（自分ひとりのボード）は4枚とも自分で書く。
       相手がいないのに「現場が書く」「あなたも相手も書く」と出すと、
       誰にも書けない欄が2枚あるように見える。ルール上は社長が全欄へ書ける。 */
    var solo = ceo && isSoloRoom(ui.room);
    var mgrWho = solo ? "あなたが書く"
      : ceo ? (partyLabel(false) || "現場") + "が書く" : "あなたが書く";
    /* 「だれが・いつ」は、書き手が1人に定まらない欄にだけ出す。
       ビジョンは1行に畳んで一覧性を優先するので出さない。
       経営ボードは自分しか書かないので、どの欄にも出さない。 */
    if (solo) return [
      { key: "ceoMind",   voice: "ceo",  title: "ビジョン",     who: ceoWho, write: true,
        fold: true, ph: "いま頭にあることを書く" },
      { key: "toManager", voice: "mgr",  title: "タスク",       who: mgrWho, write: true,
        ph: "やること・抱えていることを書く" },
      { key: "toCeo",     voice: "ceo",  title: "アウトプット", who: ceoWho, write: true,
        ph: "出したもの・決めたことを書く" },
      { key: "mgrAsk",    voice: "both", title: "やりとり",     who: "あなたが書く", write: true,
        ph: "相談・確認・質問・連絡を書く" }
    ];
    return [
      { key: "ceoMind",   voice: "ceo",  title: "ビジョン",     who: ceoWho, write: ceo,
        fold: true, ph: "いま頭にあることを書く" },
      { key: "toManager", voice: "mgr",  title: "タスク",       who: mgrWho, write: !ceo,
        meta: true, ph: "やること・抱えていることを書く" },
      { key: "toCeo",     voice: "ceo",  title: "アウトプット", who: ceoWho, write: ceo,
        meta: true, ph: "出したもの・決めたことを書く" },
      { key: "mgrAsk",    voice: "both", title: "やりとり",     who: "あなたも相手も書く", write: true,
        meta: true, ph: "相談・確認・質問・連絡を書く" }
    ];
  }

  /* ---------- 小道具 ---------- */
  function uid() { return Math.random().toString(36).slice(2, 9) + Date.now().toString(36); }
  function now() { return Date.now(); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function ago(ts) {
    if (!ts) return "未";
    var d = Math.floor((now() - ts) / DAY);
    if (d <= 0) return "今日"; if (d === 1) return "昨日";
    if (d < 31) return d + "日前"; return Math.floor(d / 30) + "か月前";
  }
  /* 自分が保存した内容がそのまま返ってきただけのときは描き直さない。
     入力中に画面を作り直すと、書いている途中の文字とカーソルが飛ぶため。 */
  function same(a, b) {
    try { return JSON.stringify(a) === JSON.stringify(b); } catch (e) { return false; }
  }
  function toArr(v) { return Array.isArray(v) ? v : (v ? Object.keys(v).map(function (k) { return v[k]; }) : []); }
  /* いま打っている最中の行を、届いたばかりの中身へ持ち越す。
     以前は社長しか書かなかったので起きなかったが、双方が同じ部屋へ書くようになったため、
     相手の更新が先に届くと「まだ保存が届いていない自分の行」が画面から消えてしまう。 */
  function keepEditing(prev, next) {
    if (!edit || !edit.live || !prev || !next) return next;
    var p = edit.pk.split("|"), k = p[0], id = p.slice(1).join("|");
    if (["ceoMind", "toCeo", "mgrAsk", "toManager"].indexOf(k) < 0) return next;
    var nw = toArr(next[k]);
    if (nw.filter(function (x) { return x && x.id === id; }).length) return next;
    var was = toArr(prev[k]), at = -1, mine = null;
    was.forEach(function (x, i) { if (x && x.id === id) { mine = x; at = i; } });
    if (!mine) return next;
    nw.splice(at < 0 || at > nw.length ? nw.length : at, 0, mine);
    next[k] = nw;
    return next;
  }
  function normBoard(b) {
    b = b || {};
    var o = {};
    ["ceoMind", "toCeo", "mgrAsk", "toManager"].forEach(function (k) { o[k] = toArr(b[k]); });
    return o;
  }
  function normField(f) {
    f = f || {};
    var o = { facilities: toArr(f.facilities), staff: toArr(f.staff), cases: toArr(f.cases) };
    o.facilities.forEach(function (x) { x.items = toArr(x.items); });
    return o;
  }

  /* 保存の決まりごとは2つ。
     1. 書き込む中身は「予約した時点」で確定させる
        （発火までに部屋を切り替えても、別の部屋の内容を書き込まないため）
     2. 触った欄だけを書く
        （欄ごと・リストごとに書けば、同じときに他の人が別の欄へ書いた内容を消さない） */
  /* key はコード内のリテラルだけを渡すこと（RTDB のパスへ連結するため）。
     DB 由来の値（fac:<id> など）は saveField 側で3つのリテラルへ丸めている。 */
  function saveBoard(key, wait) {
    var rid = ui.room; if (!rid || !rooms[rid]) return;
    /* 部屋（rid）は予約した時点で固定する。発火までに部屋を切り替えても、
       別の部屋へ書いて元の部屋を全消去しないため。
       ただし**中身は発火する瞬間に取り直す**。予約時点で固めると、待っている 700ms の間に
       届いた他の人の行を巻き添えにして消す（タスクとやりとりは複数人が同じ欄へ書く）。 */
    queue("board:" + rid + ":" + key, function () {
      var r = rooms[rid];
      if (!r) return Promise.resolve();          /* 部屋が消えていたら書かない */
      var live = (r.board && r.board[key]) || [];
      return rtdb.ref("rooms/" + rid + "/board/" + key)
        .set(JSON.parse(JSON.stringify(live)));
    }, wait, key);
  }
  function saveField(key, wait) {
    /* 施設メモ（fac:<id>）は facilities の中にあるので、facilities ごと書く */
    var top = key && key.indexOf("fac:") === 0 ? "facilities" : key;
    /* 知らない欄を渡されたら、field を丸ごと書いて他の人の更新を巻き添えにするより、
       書かずに知らせる（上位ノードを丸ごと set() しない、という決まりを崩さないため）。 */
    if (top !== "facilities" && top !== "staff" && top !== "cases") {
      ui.saving = "保存できません（対象が分かりません）";
      paintStatus();
      return;
    }
    var snap = JSON.parse(JSON.stringify(field[top] || []));
    queue("field:" + top, function () { return rtdb.ref("field/" + top).set(snap); }, wait, key);
  }
  /* 自動保存。1文字ごとには書かず、入力が止まってからまとめて1回書く。 */
  function queue(k, fn, wait, owner) {
    ui.saving = "保存中";
    paintStatus();
    savePend[k] = { fn: fn, owner: owner || "" };
    clearTimeout(saveTimers[k]);
    saveTimers[k] = setTimeout(function () { runSave(k); }, wait == null ? 400 : wait);
  }
  function runSave(k) {
    var p = savePend[k]; if (!p) return null;
    delete savePend[k];
    clearTimeout(saveTimers[k]);
    return p.fn().then(function () {
      delete failed[k];
      /* まだ直っていない欄があるなら、そちらの失敗表示を出し続ける */
      ui.saving = Object.keys(failed).length ? failMsg : "保存済み";
      paintStatus();
      /* その欄の保存が届いたら、入力中の上書き表示は役目を終える。
         失敗したときは解除しない（打った文字を画面に残すため） */
      if (edit && edit.pk.split("|")[0] === p.owner) {
        if (edit.live) delete edit.failed; else edit = null;
      }
      syncSharesSoon();                /* 渡してあるリンクの中身も追いつかせる */
    }).catch(function (e) {
      /* 失敗の表示は、その欄が保存できるようになるまで消さない */
      failed[k] = true;
      failMsg = "保存できません（" + ((e && (e.code || e.message)) || "原因不明") + "）";
      ui.saving = failMsg;
      /* 小さな文字の status だけだと、保存済みと見分けが付かない。目立つ帯にも出す。 */
      ui.msg = failMsg + " 打った内容は画面に残しています。";
      /* 打った文字を画面へ残す。reconcile に消させないための印。 */
      if (edit && !edit.live && edit.pk.split("|")[0] === p.owner) edit.failed = true;
      paintStatus();
      render();
    });
  }
  /* 部屋を移る前・ログアウト前に、保留中の保存を出しきる */
  function flushSaves() {
    return Promise.all(Object.keys(savePend).map(runSave).filter(Boolean));
  }
  function paintStatus() { var el = document.querySelector("#status"); if (el) el.textContent = ui.saving || ""; }

  /* ---------- 共有リンク ----------
     このアプリはサーバーを持たない（GitHub Pages の静的配信）ので、
     「読んでよい人か」をサーバーで判定できない。
     そこで、見せてよい中身だけを views/{あいことば} へ写し、
     閲覧ページにはそこ1か所だけを読ませる。
     views は親に .read を置かないので、あいことばを知らない人は1件も取り出せない。
     部屋・名簿・現場マネジメントは、これまでどおりログインした利用者しか読めない。

     共有の単位は「ボード1つ × 相手1人」。
       shares/{sid} = { rid, name, token, createdAt }
     相手はログインしないので、利用者登録も部屋のメンバー登録もしない。
     ⚠ 共有リンクを渡しても rooms/{rid}/members は増えない（正式なメンバーとは別概念）。 */

  /* 共有リンクへ載せてよい欄（ビジョンとアウトプット＝どちらも社長が書く欄）。
     sharePayload() の外に置いて、画面側の変更と連動させない。
     ⚠ 現場が書く欄（タスク・やりとり）を足してはならない。
        写しを書くのは社長のブラウザだけなので、現場の書き足しや削除が写しへ追いつかず、
        消したはずの内容がログイン不要の URL に残り続ける。
        経営ボード（自分ひとりのボード）では4欄とも社長しか書けないが、
        あとからメンバーを入れた瞬間に前提が崩れるので、欄は増やさず一律にする。 */
  var VIEW_KEYS = { ceoMind: 1, toCeo: 1 };
  var VIEW_SECS = [
    { key: "ceoMind", title: "ビジョン" },
    { key: "toCeo",   title: "アウトプット" }
  ];
  /* ルール上、社長しか書けない欄。database.rules.json の rooms/$rid が
     「社長のみ」で、board/toManager と board/mgrAsk にだけメンバーを足している、
     という条文と対になっている。ここを増やすときはルールも必ず一緒に見ること。 */
  var CEO_ONLY_KEYS = { ceoMind: 1, toCeo: 1 };
  /* 写しは社長のブラウザしか書かない。現場も書ける欄を載せると、
     現場の削除が写しへ追いつかず、消したはずの内容がログイン不要のURLに残る。
     許可リストを書き換えたときに気づけるよう、実行時にも確かめる。 */
  function viewKeysOk() {
    for (var i = 0; i < VIEW_SECS.length; i++) {
      var k = VIEW_SECS[i].key;
      if (VIEW_KEYS[k] !== 1) continue;
      if (CEO_ONLY_KEYS[k] !== 1) return false;
    }
    return true;
  }

  function newToken() {
    var c = window.crypto || window.msCrypto;
    if (!c || !c.getRandomValues) return "";    /* 当てられる乱数で作るくらいなら作らない */
    var b = new Uint8Array(24);                 /* 192ビット。総当たりは不可能 */
    c.getRandomValues(b);
    var s = "";
    for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
    return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function okToken(tk) { return typeof tk === "string" && /^[A-Za-z0-9_-]{22,64}$/.test(tk); }
  /* パスへ連結してよい id か。空・スラッシュを弾くだけでなく、RTDB のキーに使えない
     文字（. # $ [ ]）も弾く。通すと SDK が同期例外を投げて、押した操作が無言で止まる。 */
  function okId(x) { return typeof x === "string" && /^[A-Za-z0-9_-]{1,128}$/.test(x); }
  /* あいことばは # のあとに置く。# から先はサーバーにもリファラにも送られない。 */
  function viewUrl(tk) {
    return location.origin + location.pathname.replace(/[^\/]*$/, "") + "view.html#" + tk;
  }
  /* そのボードぶんの共有リンク（作った順） */
  function sharesOf(rid) {
    return Object.keys(shares).filter(function (sid) {
      return shares[sid] && shares[sid].rid === rid;
    }).sort(function (a, b) {
      return (shares[a].createdAt || 0) - (shares[b].createdAt || 0);
    });
  }
  /* 見せてよいものだけを組み立てる。
     UID・メールアドレス・他の人・他のボード・投稿者名・投稿日時・field は入れない。
     写しの形（rooms の配列）は旧版と同じにしてある。view.html を変えずに済ませるため。 */
  function sharePayload(sid) {
    var sh = shares[sid] || {};
    var r = rooms[sh.rid];
    var out = { sid: sid, who: String(sh.name || ""), rooms: [] };
    if (!r) return out;                          /* ボードが消えていたら中身なし */
    /* 現場も書ける欄が許可リストへ紛れ込んだら、写しを作らない（空＝写しを消す） */
    if (!viewKeysOk()) {
      ui.saving = "共有リンクの設定が正しくないため、中身を更新していません。";
      paintStatus();
      return out;
    }
    var b = r.board || {};
    /* ⚠ ここは許可リストである。画面の欄を組み立てる cards() と共通化してはならない。
       共通化すると、ログインなしで読める views/{token} へタスク・やりとりまで流れ出る。
       共有リンクに載せるのは社長が書く2枚だけ、という意図的な線引き。 */
    var secs = VIEW_SECS.filter(function (x) { return VIEW_KEYS[x.key] === 1; })
      .map(function (x) {
        return {
          title: x.title,
          items: toArr(b[x.key])
            .map(function (it) { return String((it && it.text) || ""); })
            .filter(function (t) { return t.trim() !== ""; })
        };
      });
    /* 名前を付けていない経営ボードでも、見出しが空にならないようにする */
    out.rooms.push({ name: roomLabel(sh.rid), secs: secs });
    return out;
  }
  /* 中身が変わったときだけ書く（同じ内容を何度も送らない） */
  function syncShares() {
    /* 名簿と部屋が届く前に書くと、中身の無い写しを配って
       「使えません」と誤って見せてしまう。揃うまで待つ。 */
    if (!isCeo() || !gotRooms || !gotMembers) return Promise.resolve();
    var live = {}, jobs = [];
    Object.keys(shares).forEach(function (sid) {
      var sh = shares[sid], tk = sh && sh.token;
      if (!okToken(tk) || !okId(sid)) return;
      /* ボードごと消えたら、台帳も写しも残さない */
      if (!sh.rid || !rooms[sh.rid]) { jobs.push(dropShare(sid, true).catch(function () {})); return; }
      live[tk] = true;
      var j = JSON.stringify(sharePayload(sid));
      if (shareSent[tk] === j) return;
      var p = JSON.parse(j);
      if (!p.rooms.length) {
        shareSent[tk] = j;
        jobs.push(rtdb.ref("views/" + tk).remove().catch(shareFailed(tk)));
        return;
      }
      /* 入り直した直後は控え（shareSent）が空なので、そのまま書くと中身が同じでも
         updatedAt だけ進み、相手の画面に「更新されました」と嘘の最終更新が出る。
         最初の1回だけ今の写しを読んで、同じなら書かずに控えを埋める。 */
      if (!owns(shareSent, tk)) {
        jobs.push(rtdb.ref("views/" + tk).once("value").then(function (sn) {
          shareSent[tk] = j;
          if (sameCopy(sn.val(), p)) return;      /* 中身が同じなら書かない */
          p.updatedAt = now();
          return rtdb.ref("views/" + tk).set(p);
        }).catch(shareFailed(tk)));
        return;
      }
      shareSent[tk] = j;
      p.updatedAt = now();
      jobs.push(rtdb.ref("views/" + tk).set(p).catch(shareFailed(tk)));
    });
    /* 使わなくなった控えは残さない */
    Object.keys(shareSent).forEach(function (tk) { if (!live[tk]) delete shareSent[tk]; });
    return Promise.all(jobs);
  }
  /* 今ある写しと、これから書く中身が同じか。
     ⚠ JSON の文字列比較は使えない。RTDB は空の配列を落とし、キーの順も保証しないので、
     中身が同じでも文字列は一致せず、毎回書き直して「最終更新」だけが進む。 */
  function sameCopy(cur, p) {
    if (!cur || !p) return false;
    if (String(cur.who || "") !== String(p.who || "")) return false;
    if (String(cur.sid || "") !== String(p.sid || "")) return false;
    var a = toArr(cur.rooms), b = toArr(p.rooms);
    if (a.length !== b.length) return false;
    for (var i = 0; i < a.length; i++) {
      if (String(a[i].name || "") !== String(b[i].name || "")) return false;
      var x = toArr(a[i].secs), y = toArr(b[i].secs);
      if (x.length !== y.length) return false;
      for (var k = 0; k < x.length; k++) {
        if (String(x[k].title || "") !== String(y[k].title || "")) return false;
        var xi = toArr(x[k].items), yi = toArr(y[k].items);
        if (xi.length !== yi.length) return false;
        for (var m = 0; m < xi.length; m++) if (String(xi[m]) !== String(yi[m])) return false;
      }
    }
    return true;
  }

  /* 写しの更新に失敗したら黙らない。古い中身が見えたままになるため。 */
  function shareFailed(tk) {
    return function (e) {
      delete shareSent[tk];
      ui.saving = "共有リンクの中身を更新できません（" + ((e && (e.code || e.message)) || "原因不明") + "）";
      /* 「消したはずの行が共有URLに残る」という一番気づきにくい失敗なので、
         小さな status だけでなく目立つ帯にも出す（保存失敗と同じ扱い）。 */
      ui.msg = ui.saving + " 渡してあるURLには古い内容が見えています。";
      paintStatus();
      render();
    };
  }
  /* 予約は全件ぶんで1本しかないので、止めたら必ず取り直す。
     取り直さないと、ほかのリンクの写しの更新が黙って捨てられる。 */
  function stopShareTimer() { clearTimeout(shareTimer); shareTimer = null; }
  function syncSharesSoon() {
    stopShareTimer();
    if (!isCeo() || !Object.keys(shares).length) return;
    shareTimer = setTimeout(function () { shareTimer = null; syncShares(); }, 800);
  }
  /* 画面を離れる前に、予約してある写しの更新を出しきる。
     取りこぼすと「消したはずの行」が共有リンク側に残る。 */
  function flushShares() {
    stopShareTimer();
    return syncShares();          /* 変わっていなければ何も書かない */
  }

  /* 旧「利用者ごとの閲覧リンク」（viewLinks/{uid}）を、ボードごとの共有（shares）へ移す。
     ⚠ token はそのまま引き継ぐ。作り直すと、すでに渡してあるURLが黙って死ぬ。
     旧版は「その人が入っている全部屋」を1つの写しへ入れていたので、
     ボード単位へ割り直す（複数あればボードごとに1本ずつ作る）。 */
  function migrateLinks() {
    if (migrated || !isCeo() || !gotRooms || !gotMembers) return;
    var us = Object.keys(legacyLinks);
    /* 旧台帳がまだ届いていないだけかもしれない。ここで「済み」にすると、
       あとから届いた分を取りこぼして、渡してあるURLが死ぬ。 */
    if (!us.length) return;
    migrated = true;
    var upd = {}, made = [];
    us.forEach(function (u) {
      var l = legacyLinks[u], tk = l && l.token;
      if (!okId(u)) return;
      upd["viewLinks/" + u] = null;
      if (!okToken(tk)) return;
      /* ⚠ 旧ルールは members/{uid}/active === true を要求していたので、止めた人の
         リンクはルール層で死んでいた。新しい shares は active を見ないため、
         ここで移してしまうと「止めたはずのURL」が社長のログインだけで復活する。
         台帳も写しも落として、移行しない。 */
      var lm = owns(members, u) ? members[u] : null;
      if (!lm || lm.active === false) { upd["views/" + tk] = null; return; }
      var mine = myRooms().filter(function (rid) {
        var r = rooms[rid];
        return r && owns(r.members || {}, u) && r.members[u] === true;
      });
      if (!mine.length) { upd["views/" + tk] = null; return; }   /* 見せる先が無い */
      /* ルールは name / who を60字までしか許さない。切らずに渡すと update ごと
         .validate で落ちて、全員ぶんの移行が永久に完了しない。 */
      var nm = String((owns(members, u) && members[u] && members[u].name) || "").slice(0, 60);
      mine.forEach(function (rid, i) {
        /* 1本目だけ token を引き継ぐ。2本目以降は新しく作る（元々1本しか無い運用） */
        var t = i === 0 ? tk : newToken();
        if (!t) return;
        var sid = uid();
        var rec = { rid: rid, name: nm, token: t, createdAt: (l && l.createdAt) || now() };
        upd["shares/" + sid] = rec;
        shares[sid] = rec;                 /* 写しを組み立てるために手元へ先に入れる */
        made.push({ sid: sid, token: t });
      });
    });
    /* 写しも同じ update で新しい形（sid つき）へ書き換える。
       台帳だけ先に移すと、写しが古い形のまま残ってルールの読み取りが通らず、
       渡してあるURLが「使えません」になる時間ができる。 */
    made.forEach(function (x) {
      var j = JSON.stringify(sharePayload(x.sid));
      var pl = JSON.parse(j);
      if (!pl.rooms.length) { upd["views/" + x.token] = null; return; }
      pl.updatedAt = now();
      upd["views/" + x.token] = pl;
      shareSent[x.token] = j;
    });
    if (!Object.keys(upd).length) { migrated = false; return; }
    rtdb.ref().update(upd).then(function () {
      legacyLinks = {};
      /* 旧リンク1本が複数ボードを見せていた場合、2本目以降は新しいURLになる。
         そのままだと誰にも渡っていない「共有中」の行が残るので、必ず知らせる。 */
      if (made.length > us.length) {
        ui.msg = "閲覧リンクをボードごとの共有リンクへ移しました。" +
          "1人が複数のボードを見ていた分は新しいURLになっています。" +
          "各ボードの「共有」から、渡し直すか止めるかを決めてください。";
      }
      render();
    }).catch(function (err) {
      /* 戻せないと、DBに無い共有リンクを画面に出したままになる */
      made.forEach(function (x) { delete shares[x.sid]; delete shareSent[x.token]; });
      migrated = false;                    /* 次のスナップショットでやり直す */
      /* 黙って再試行し続けると、旧リンクの中身が古いまま読めることに気づけない */
      ui.msg = "前の閲覧リンクを共有リンクへ移せませんでした（" +
        ((err && (err.code || err.message)) || "原因不明") +
        "）。渡してあるURLの中身が古いままになります。";
      render();
    });
  }

  /* 台帳から外れた写しを片づける。
     写しは token を知らないと読めないので、放っておくと誰も消せない置き土産になる。
     社長のルールにだけ views の一覧を許してあるので、入り直したときに1回だけ掃除する。 */
  var viewSwept = false;
  function sweepViews() {
    if (viewSwept || !isCeo()) return;
    viewSwept = true;
    /* 写しを先に、台帳をあとに読む。この順なら、読んでいる間に
       別のタブで作られたリンクは必ず台帳側に入るので、消しすぎない。
       （逆にすると、作ったばかりの写しを消しかねない）
       移行が済むまでは旧台帳（viewLinks）も「生きている」側として数える。 */
    rtdb.ref("views").once("value").then(function (s) {
      return Promise.all([rtdb.ref("shares").once("value"), rtdb.ref("viewLinks").once("value")])
        .then(function (ls) { return [s, ls[0], ls[1]]; });
    }).then(function (ss) {
      var all = ss[0].val() || {}, sh = ss[1].val() || {}, old = ss[2].val() || {};
      var keep = {}, upd = {}, n = 0;
      Object.keys(sh).forEach(function (sid) {
        var tk = sh[sid] && sh[sid].token;
        if (tk) keep[tk] = true;
      });
      Object.keys(old).forEach(function (u) {
        var tk = old[u] && old[u].token;
        if (tk) keep[tk] = true;
      });
      Object.keys(all).forEach(function (tk) {
        if (!keep[tk]) { upd["views/" + tk] = null; n++; }
      });
      if (n) rtdb.ref().update(upd).catch(function () {});
    }).catch(function () {});
  }
  /* 台帳の購読を外す。外したことを忘れると、入り直したときに購読し直せない。 */
  function dropShareSub() {
    if (shareRef) { shareRef.off(); shareRef = null; }
    if (legacyRef) { legacyRef.off(); legacyRef = null; }
    shares = {}; shareSent = {}; viewSwept = false;
    legacyLinks = {}; migrated = false;
  }
  /* リンクを使えなくする。台帳と写しの両方を落とせば、渡したURLはその場で無効になる。
     auto=true は syncShares からの自動の後始末。
     こちらから予約を入れ直すと、消せない間ずっと回り続ける。 */
  function dropShare(sid, auto) {
    /* sid が空のまま連結すると shares ごと消える。ここで必ず止める。 */
    if (!okId(sid)) return Promise.resolve();
    var prev = shares[sid], tk = prev && prev.token, upd = {};
    upd["shares/" + sid] = null;
    if (okToken(tk)) { upd["views/" + tk] = null; delete shareSent[tk]; }
    /* 手元の台帳も先に落とす。予約済みの書き込みが、消した写しを書き戻さないように。 */
    delete shares[sid];
    stopShareTimer();
    return rtdb.ref().update(upd).then(function () {
      if (!auto) syncSharesSoon();      /* ほかのリンクぶんの更新を捨てない */
    }, function (e) {
      /* 消せなかったのに画面から消えると、生きているURLを止められなくなる */
      if (prev) shares[sid] = prev;
      if (!auto) syncSharesSoon();
      render();
      throw e || {};
    });
  }

  /* 課題の状態。古いデータは done しか持っていないので、そこから読む。 */
  function stat(c) {
    var v = c && c.status;
    if (v === "todo" || v === "doing" || v === "done") return v;
    return (c && c.done) ? "done" : "todo";
  }
  var STAT_LABEL = { todo: "未対応", doing: "対応中", done: "完了" };

  function fac(id) { return field.facilities.filter(function (f) { return f && f.id === id; })[0]; }
  function facName(id) { var f = fac(id); return f ? f.name : ""; }
  function arrFor(key) {
    if (key.indexOf("fac:") === 0) { var f = fac(key.slice(4)); if (!f) return []; if (!f.items) f.items = []; return f.items; }
    if (key === "facilities" || key === "staff" || key === "cases") return field[key];
    var r = room(); if (!r) return [];
    if (!r.board) r.board = JSON.parse(JSON.stringify(EMPTY_BOARD));
    if (!r.board[key]) r.board[key] = [];
    return r.board[key];
  }
  function setArr(key, v) {
    if (key.indexOf("fac:") === 0) { var f = fac(key.slice(4)); if (f) f.items = v; return; }
    if (key === "facilities" || key === "staff" || key === "cases") { field[key] = v; return; }
    board()[key] = v;
  }
  /* 画面から書き換えてよい項目。属性を細工されても by や id を上書きさせない。 */
  function editableField(f) {
    return ["title", "assignee", "name", "concern"].indexOf(f) >= 0;
  }
  function isFieldKey(k) {
    return k.indexOf("fac:") === 0 || k === "facilities" || k === "staff" || k === "cases";
  }
  function saveFor(key, wait) { if (isFieldKey(key)) saveField(key, wait); else saveBoard(key, wait); }

  /* ---------- ノート内ブロックの編集状態 ---------- */
  function pkOf(key, id) { return key + "|" + id; }
  /* 末尾の「ここに続けて入力」欄。実体になるまで id を使い回して入力を切らさない。 */
  function newId(key) { if (!ui.newId[key]) ui.newId[key] = uid(); return ui.newId[key]; }
  function textOf(key, id) {
    var o = find(key, id);
    return o ? String(o.text == null ? "" : o.text) : null;
  }
  function shownText(key, it) {
    if (edit && edit.pk === pkOf(key, it.id)) return edit.val;
    return String(it.text == null ? "" : it.text);
  }
  /* 保存が本当に届いたら上書き表示をやめる。届くまでは入力した文字を消さない。 */
  function reconcile() {
    /* 保存を断られた行は、サーバーに無くても画面から消さない。
       消すと、打った文字がどこにも残らないまま行ごと消える。 */
    if (!edit || edit.live || edit.failed) return;
    var p = edit.pk.split("|"), cur = textOf(p[0], p.slice(1).join("|"));
    if (cur === null || cur === edit.val) edit = null;
  }
  /* 入力を反映する。末尾の空欄に書き始めたときだけ、その場で実体を作る。
     実体を作ったときは true を返す（画面はその場で作り替える。描き直すと入力が途切れるため）。 */
  function applyEdit(key, id, val) {
    var o = find(key, id);
    /* 画面の要素を細工されても、直してよい行以外は書き換えない */
    if (o && !canEditRow(key, o)) return false;
    edit = { pk: pkOf(key, id), val: val, live: true };
    if (o) { o.text = val; saveFor(key, 700); return false; }
    if (!val) return false;
    arrFor(key).push({ by: me.uid, createdAt: now(), id: id, text: val });
    ui.fresh[pkOf(key, id)] = true;
    ui.open[pkOf(key, id)] = true;      /* 作ったばかりの行は開いたままにする */
    if (ui.newId[key] === id) delete ui.newId[key];
    if (key.indexOf("fac:") === 0) { var f = fac(key.slice(4)); if (f) f.updatedAt = now(); }
    saveFor(key, 700);
    return true;
  }
  /* 編集中の行を確定する。
     いま自分で作ったばかりの行が空のままなら片づける。
     もとからあった行は、空にしても勝手には消さない（× → 消す で消してもらう）。 */
  function commitEdit() {
    if (!edit) return false;
    edit.live = false;
    var p = edit.pk.split("|"), key = p[0], id = p.slice(1).join("|");
    var o = find(key, id), gone = false;
    if (o && !String(o.text == null ? "" : o.text).trim() && ui.fresh[edit.pk]) {
      setArr(key, arrFor(key).filter(function (x) { return !x || x.id !== id; }));
      delete ui.fresh[edit.pk];
      edit = null; gone = true;
    }
    if (o) saveFor(key, 0);
    return gone;
  }
  /* 壊れた行（null）が混ざっていても落ちないようにする */
  function find(key, id) { return arrFor(key).filter(function (x) { return x && x.id === id; })[0]; }

  /* その行を直す・消してよいか。描く前だけでなく、実際に書き換える入口でも通す。
     ⚠ これは画面の一貫性のための担保であって、認可ではない。
        board はリストごと置き換える方式なので、ルール層では行単位に縛れない（AGENTS.md）。 */
  function canEditRow(key, it) {
    if (!it || !me) return false;
    if (it.by === me.uid) return true;      /* 自分が書いた行はいつでも直せる・消せる */
    if (isFieldKey(key)) return isCeo();
    var c = cards().filter(function (x) { return x.key === key; })[0];
    return !!(c && c.write) && isCeo();     /* 人の行は、その欄を書ける社長だけ */
  }

  /* ---------- 入口 ---------- */
  function gateHtml() {
    return '<div class="gate"><h1>穂乃味ボード</h1>' +
      '<input id="mail" type="email" inputmode="email" placeholder="メールアドレス" autocomplete="username">' +
      '<input id="pw" type="password" placeholder="パスワード" autocomplete="current-password" style="margin-top:8px">' +
      '<button data-act="login">開く</button>' +
      '<button data-act="forgot" style="background:transparent;color:var(--ink3);font-weight:400">パスワードを忘れた</button>' +
      (ui.gateErr ? '<p class="err">' + esc(ui.gateErr) + "</p>" : "") + "</div>";
  }

  function captureDrafts() {
    var a = document.querySelector("#addInput"); if (a) ui.addDraft = a.value;
    var ap = document.querySelector("#addPlace"); if (ap) ui.addPlace = ap.value;
    var rn = document.querySelector("#roomName"); if (rn) ui.newRoomName = rn.value;
    var sn = document.querySelector("#shareName"); if (sn) ui.shareName = sn.value;
  }

  /* 書き換えの前後で、入力中の行とカーソル位置を保つ */
  function snapFocus() {
    var a = document.activeElement;
    if (!a || !a.getAttribute) return null;
    var pk = a.getAttribute("data-pk");
    if (!pk) return null;
    var st = 0, en = 0;
    try { st = a.selectionStart; en = a.selectionEnd; } catch (e) {}
    return { pk: pk, s: st, e: en };
  }
  function restoreFocus(f) {
    if (!f) return false;
    /* data-pk には DB 由来の id が入る。セレクタへ連結すると壊れるので走査して探す */
    var all = document.querySelectorAll("[data-pk]"), el = null;
    for (var i = 0; i < all.length; i++) {
      if (all[i].getAttribute("data-pk") === f.pk) { el = all[i]; break; }
    }
    if (!el) return false;
    el.focus();
    var st = f.s < 0 ? el.value.length : f.s, en = f.e < 0 ? el.value.length : f.e;
    try { el.setSelectionRange(st, en); } catch (e) {}
    return true;
  }
  function grow(el) { el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; }
  function growAll() {
    var t = document.querySelectorAll("textarea.btxt"), i;
    for (i = 0; i < t.length; i++) grow(t[i]);
    /* 1回目で折り返しが変わることがあるので、描画が落ち着いてからもう一度測る */
    if (window.requestAnimationFrame) requestAnimationFrame(function () {
      var u = document.querySelectorAll("textarea.btxt");
      for (var j = 0; j < u.length; j++) grow(u[j]);
    });
  }
  var growTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(growTimer);
    growTimer = setTimeout(growAll, 120);
  });
  function setHtml(h) {
    rendering = true;
    var app = document.getElementById("app");
    /* 共有ボードだけ左右2列にするので広くする */
    app.className = (me && ui.tab === "board") ? "wide" : "";
    app.innerHTML = h;
    rendering = false;
  }

  /* ---------- 描画 ---------- */
  function render() {
    /* 変換中やドラッグ中に書き換えると入力が壊れるので、終わってから描く */
    if (composing() || drag || held()) { pendingRender = true; return; }
    pendingRender = false;
    reconcile();

    if (!me) {
      setHtml(gateHtml());
      var p = document.querySelector("#mail"); if (p) p.focus();
      return;
    }
    captureDrafts();

    var ids = myRooms();
    if (ids.length && !rooms[ui.room]) ui.room = ids[0];

    var CARDS = cards();
    var stale = field.cases.filter(function (c) { return stat(c) !== "done" && now() - c.updatedAt > 7 * DAY; });
    var cold = field.staff.filter(function (s) { return now() - (s.followedAt || 0) > 14 * DAY; });
    var alerts = stale.length + cold.length;

    var h = '<div class="top"><div class="brand"><h1 class="name">穂乃味ボード</h1>' +
      '<span class="sub" id="status">' + esc(ui.saving || "") + "</span></div>" +
      '<div class="whoami"><span class="tagme" style="background:' +
      (isCeo() ? "var(--ceo)" : "var(--mgr)") + '">' + esc(me.name || me.mail) + "</span>" +
      (isCeo() ? '<button data-act="settings">設定</button>' : "") +
      '<button data-act="logout">ログアウト</button></div>';

    h += '<div class="rooms">';
    ids.forEach(function (rid) {
      h += '<button data-act="room" data-id="' + esc(rid) + '" data-on="' + (ui.room === rid ? 1 : 0) + '">' +
        esc(roomLabel(rid)) + "</button>";
    });
    if (isCeo()) h += '<button class="plus" data-act="newroom" title="ボードを作る" ' +
      'aria-label="ボードを作る">＋</button>';
    h += "</div>";

    h += '<div class="tabs">' +
      '<button data-act="tab" data-v="board" data-on="' + (ui.tab === "board" ? 1 : 0) + '">共有ボード</button>' +
      '<button data-act="tab" data-v="field" data-on="' + (ui.tab === "field" ? 1 : 0) + '">現場マネジメント' +
      (alerts ? '<span class="badge">' + alerts + "</span>" : "") + "</button>" +
      /* 共有は「今開いているボード」に対する操作なので、ボードのタブの並びに置く。
         経営ボード（自分ひとり）でも同じように押せる。 */
      (isCeo() && ids.length && ui.tab === "board"
        ? '<button class="shr" data-act="share" data-on="' + (ui.share ? 1 : 0) + '">共有' +
          (sharesOf(ui.room).length ? '<span class="badge">' + sharesOf(ui.room).length + "</span>" : "") +
          "</button>"
        : "") + "</div></div>";

    h += '<div class="body">';
    if (ui.msg) h += '<div class="notice">' + esc(ui.msg) + "</div>";
    if (ui.newRoom && isCeo()) h += newRoomHtml();
    if (ui.settings && isCeo()) h += settingsHtml();
    if (ui.share && isCeo() && ui.tab === "board" && rooms[ui.room]) h += shareHtml();

    if (ui.tab === "board") {
      h += ids.length ? boardHtml(CARDS)
        : isCeo()
          ? '<p class="empty">ボードがまだありません。＋であなたの経営ボードを作れます。</p>'
          : '<p class="empty">まだどのボードにも入っていません。社長に入れてもらってください。</p>';
    } else h += fieldHtml(stale, cold);

    h += "</div>";

    var keep = snapFocus();
    setHtml(h);
    growAll();
    var wantAdd = ui.focusAdd;
    ui.focusAdd = false;                    /* 立てたら必ず1回で使い切る */
    if (!restoreFocus(keep) && wantAdd) {
      var f = document.querySelector("#addInput");
      if (f) { f.focus(); try { f.setSelectionRange(f.value.length, f.value.length); } catch (e) {} }
    }
  }

  function newRoomHtml() {
    var h = '<div class="panel"><h3>部屋を作る</h3>' +
      '<div class="field"><label>部屋の名前</label>' +
      '<input id="roomName" value="' + esc(ui.newRoomName) + '" placeholder="部屋の名前"></div>';
    var any = false;
    Object.keys(members).forEach(function (u) {
      if (u === me.uid) return;
      var m = members[u] || {};
      if (m.active === false) return;
      any = true;
      h += '<label class="chk"><input type="checkbox" data-pickuid="' + esc(u) + '"' +
        (ui.newRoomPick[u] ? " checked" : "") + "><span>" + esc(m.name || m.mail || u) + "</span></label>";
    });
    h += '<p class="hint">' + (any ? "だれも選ばなければ、あなただけの経営ボードになります。"
      : "あなただけの経営ボードになります。") +
      "読むだけの人へは、あとから「共有」でリンクを渡せます。</p>";
    return h + '<button class="btn" data-act="makeroom">作る</button>' +
      '<button class="btn ghost" data-act="newroom" style="margin-left:8px">やめる</button></div>';
  }

  /* クリップボードへ書く。⚠ 「押した操作」の流れの中で呼ぶこと。
     ネットワークの返事を待ってから呼ぶと、Safari では毎回拒否される。 */
  function clipWrite(url) {
    if (!navigator.clipboard || !navigator.clipboard.writeText) return Promise.reject();
    try { return navigator.clipboard.writeText(url); } catch (e) { return Promise.reject(e); }
  }
  /* リンクをコピーする。入らなかったときだけ、選んで写せるようにURLを出す。 */
  function copyLink(sid, okMsg) {
    var sh = shares[sid];
    if (!sh || !okToken(sh.token)) return;
    clipWrite(viewUrl(sh.token)).then(function () {
      ui.showUrl = ""; ui.msg = okMsg; render();
    }, function () {
      ui.showUrl = sid;
      ui.msg = "コピーできませんでした。下に出たURLを選んで写してください。";
      render();
    });
  }

  /* ---------- 共有パネル ----------
     「共有」→「共有リンクを作成」→ 自動でコピー →「リンクを送る」で終わる。
     相手の利用者登録も、ボードのメンバー追加も要らない。
     あいことばそのものは画面に出さない（肩越しの覗き見・スクショ対策）。
     コピーできなかったときだけ、選んで写せるようにURLを出す。 */
  function shareHtml() {
    var rid = ui.room, r = rooms[rid];
    if (!r) return "";
    var h = '<div class="panel"><h3>' + esc(roomLabel(rid)) + " を共有する</h3>" +
      '<p class="hint">リンクを渡した人は、ログインなしで<b>ビジョン</b>と<b>アウトプット</b>を' +
      "<b>読むだけ</b>できます。書き足し・書き換え・削除はできません。" +
      "タスク・やりとり・現場マネジメント・利用者の名前は見えません。</p>";

    var list = sharesOf(rid);
    if (list.length) {
      list.forEach(function (sid) {
        var sh = shares[sid];
        h += '<div class="vline"><span class="pname">' + esc(sh.name || "（宛先なし）") + "</span>" +
          '<span class="pnote">共有中</span>' +
          '<button class="go" data-act="scopy" data-id="' + esc(sid) + '">リンクをコピー</button>' +
          '<button data-act="sredo" data-id="' + esc(sid) + '">作り直す</button>' +
          '<button class="stop" data-act="sstop" data-id="' + esc(sid) + '">共有をやめる</button>';
        if (ui.showUrl === sid) {
          h += '<input class="vurl" readonly value="' + esc(viewUrl(sh.token)) + '">';
        }
        h += "</div>";
      });
    } else {
      h += '<p class="empty">まだ共有していません。</p>';
    }

    h += '<div class="rin"><input id="shareName" value="' + esc(ui.shareName) +
      '" placeholder="だれに渡すか（例: 谷村さん）" aria-label="だれに渡すか">' +
      '<button class="send plain" data-act="snew">共有リンクを作成</button></div>';
    return h + '<div style="margin-top:16px"><button data-act="share" ' +
      'style="background:none;border:0;font-size:12px;color:var(--ink3)">共有を閉じる</button></div></div>';
  }

  function settingsHtml() {
    var h = '<div class="panel"><h3>設定</h3>' +
      '<div class="field"><label>あなたの表示名</label>' +
      '<input data-mname="' + esc(me.uid) + '" value="' + esc(me.name || "") + '" placeholder="谷口"></div>';

    h += '<h3 style="margin-top:18px">部屋</h3>';
    myRooms().forEach(function (rid) {
      var r = rooms[rid];
      var who = Object.keys(r.members || {}).filter(function (u) { return u !== me.uid; })
        .map(nameOfUid).join("、");
      var rn = roomLabel(rid);
      var sn = sharesOf(rid).length;
      h += '<div class="pline"><span class="pname">' + esc(rn) + "</span>" +
        /* 名前を付けていない経営ボードは、見出しがすでに「経営ボード」なので繰り返さない */
        '<span class="pnote">' + esc(who || (r.name ? "経営ボード" : "")) +
        (sn ? (who || r.name ? "・" : "") + "共有 " + sn + "件" : "") + "</span>" +
        '<button data-act="editroom" data-id="' + esc(rid) + '" aria-label="' + esc(rn) +
          'を変える">変える</button>' +
        '<button data-act="delroom" data-id="' + esc(rid) + '" aria-label="' + esc(rn) +
          'を削除" style="font-weight:700;color:var(--bad)">削除</button></div>';
    });

    h += '<h3 style="margin-top:18px">利用者</h3>';
    Object.keys(members).forEach(function (u) {
      var m = members[u] || {};
      if (u === me.uid) {
        h += '<div class="pline"><span class="pname">' + esc(m.name || m.mail || u) +
          '</span><span class="pnote">あなた</span></div>';
        return;
      }
      /* 一時的に止める操作は持たない。外すときは「削除」だけ。 */
      var mn = m.name || m.mail || "この利用者";
      h += '<div class="pline"><input value="' + esc(m.name || "") + '" data-mname="' + esc(u) +
        '" placeholder="表示名" aria-label="' + esc(mn) + 'の表示名">' +
        '<span class="pnote">' + (m.active === false ? "使えません" : "使えます") + "</span>" +
        '<button data-act="delmember" data-id="' + esc(u) + '" aria-label="' + esc(mn) +
        'を削除" style="font-weight:700;color:var(--bad)">削除</button></div>';
    });

    if (ui.invite) {
      h += '<div class="field"><label>名前</label><input id="invName" placeholder="谷村"></div>' +
        '<div class="field"><label>メールアドレス</label><input id="invMail" type="email" placeholder="mail@example.com"></div>' +
        '<div class="field"><label>最初のパスワード（6文字以上）</label><input id="invPw" type="text" placeholder="6文字以上"></div>' +
        '<button class="btn" data-act="doinvite">登録する</button>' +
        '<button class="btn ghost" data-act="invite" style="margin-left:8px">やめる</button>';
    } else {
      h += '<button class="btn ghost" data-act="invite">人を追加する</button>';
    }

    return h + '<div style="margin-top:16px"><button data-act="settings" style="background:none;border:0;font-size:12px;color:var(--ink3)">設定を閉じる</button></div></div>';
  }

  /* 「だれが・いつ」。書き手が1人に定まらない欄の行に出す。
     ⚠ by と createdAt は書いた人の自己申告で、DB のルールでは縛れない
     （board はリストごと置き換えるので、by === auth.uid を .validate で強制すると
       他人の行を含むリストが書けなくなる）。
     そのため、せめて**その部屋にいない人の名前は出さない**。
     同じ部屋のメンバー同士の名乗りは UI 層でしか担保できない（AGENTS.md の既知事項）。 */
  function stamp(ts) {
    if (typeof ts !== "number" || !isFinite(ts) || ts <= 0) return "";
    var d = new Date(ts);
    if (isNaN(d.getTime())) return "";
    /* 年をまたいだ古い行が「今年のもの」に見えないよう、違う年なら年も出す */
    var y = d.getFullYear() !== new Date().getFullYear() ? d.getFullYear() + "/" : "";
    return y + (d.getMonth() + 1) + "/" + d.getDate() + " " +
      d.getHours() + ":" + ("0" + d.getMinutes()).slice(-2);
  }
  function posterName(u) {
    if (me && u === me.uid) return me.name || "自分";
    var r = room();
    if (!u || !r || !owns(r.members || {}, u) || r.members[u] !== true) return "だれか";
    return nameOfUid(u);
  }
  function metaHtml(it) {
    var t = stamp(it.createdAt);
    /* 相手の名前を濃く出す。やりとりは名前しか手がかりが無く、
       「谷口」「谷村」のように1文字違いだと流し読みで取り違えるため。 */
    var mine = !!(me && it.by === me.uid);
    return '<div class="meta"><span class="' + (mine ? "mine" : "other") + '">' +
      esc(posterName(it.by)) + "</span>" + (t ? " ・ " + esc(t) : "") + "</div>";
  }

  /* ノートの中の1ブロック。書ける人にはつまみ・本文・消すボタンを出す。
     opt = { label, fold, meta }
     畳む欄（ビジョン）は、開くまで本文を1行だけ出す。編集も開いてから。 */
  function blkHtml(key, it, canEdit, opt) {
    var pk = pkOf(key, it.id), txt = shownText(key, it);
    /* いま打っている行は畳まない。畳むと <p> に変わってフォーカスが外れ、
       そのあとの打鍵がどこにも入らずに消える（新しく作った行で起きる）。 */
    var open = !opt.fold || ui.open[pk] === true || !!(edit && edit.pk === pk && edit.live);
    var meta = opt.meta ? metaHtml(it) : "";
    var body;
    if (!open || !canEdit) {
      /* 読むだけの行と、畳んでいる行は <p> で出す。畳む欄なら押して開け閉めできる。 */
      body = '<p class="btxt' + (opt.fold ? " foldable" : "") + (open ? "" : " clip") + '"' +
        (opt.fold ? ' data-act="fold" data-fold="' + esc(pk) +
          '" title="' + esc(open ? "1行にたたむ" : txt) + '"' : "") +
        ">" + esc(txt) + "</p>";
    } else {
      body = taHtml(pk, key, it.id, txt, "", opt.label);
    }
    if (!canEdit) {
      /* 動かせないが、並べ替えの対応付けには id が要る */
      return '<div class="blk" data-id="' + esc(it.id) + '" data-list="' + esc(key) + '">' +
        '<span class="grip ghost" aria-hidden="true"></span>' + body +
        foldBtnHtml(opt, pk, open) + meta + "</div>";
    }
    var ask = "";
    if (ui.confirmDel === pk) {
      var n = txt.split("\n").length;
      ask = '<div class="ask"><span>' + (n > 1 ? "この" + n + "行" : "この行") + "を消しますか？</span>" +
        '<button type="button" data-act="dodel" data-list="' + esc(key) + '" data-id="' + esc(it.id) +
          '">消す</button>' +
        '<button type="button" class="no" data-act="nodel">やめる</button></div>';
    }
    return '<div class="blk" data-id="' + esc(it.id) + '" data-list="' + esc(key) + '">' +
      '<button class="grip" type="button" tabindex="-1" data-grip title="つかんで上下に動かす" ' +
        'aria-label="順番を変える">⣿</button>' +
      body + foldBtnHtml(opt, pk, open) +
      '<button class="bx" type="button" data-act="askdel" data-list="' + esc(key) + '" data-id="' +
        esc(it.id) + '" title="この行を消す" aria-label="この行を消す">×</button>' +
      meta + ask + "</div>";
  }

  /* 開け閉めのボタン。畳んでいるときも出す。
     ・畳んだ行は本文を押しても開けるが、それだけだと「押せる」と分からないし、
       キーボードだけの人は開けない
     ・開いた行が textarea のときは本文を押しても畳めないので、このボタンが唯一の手段 */
  function foldBtnHtml(opt, pk, open) {
    if (!opt.fold) return "";
    var lab = open ? "1行にたたむ" : "全文を出す";
    return '<button class="fold" type="button" data-act="fold" data-fold="' + esc(pk) +
      '" title="' + lab + '" aria-label="' + lab + '" aria-expanded="' + (open ? "true" : "false") +
      '">' + (open ? "⌃" : "⌄") + "</button>";
  }

  /* textarea は先頭の改行が食われるので1つ足しておく */
  function taHtml(pk, key, id, txt, ph, label) {
    return '<textarea class="btxt" rows="1" data-pk="' + esc(pk) + '" data-list="' + esc(key) +
      '" data-id="' + esc(id) + '" placeholder="' + esc(ph) + '" aria-label="' + esc(label) + '">' +
      (txt.charAt(0) === "\n" ? "\n" : "") + esc(txt) + "</textarea>";
  }

  /* 画面に出せる行だけを返す。DB は中身を検証しないので null や id の無い行が混ざりうる。
     そのまま扱うと canEditItem(it) の it.by で落ち、render ごと止まって画面が固まる。
     ⚠ 落としているのは画面だけ。DB のデータには触らない。 */
  function rowsOf(key) {
    return arrFor(key).filter(function (it) { return it && it.id; });
  }

  /* 1項目＝1枚のノート。中身が増えてもカードは増やさない。
     opt = { canAdd, canEdit(it), label, ph } */
  function noteHtml(key, opt) {
    var items = rowsOf(key);
    var h = '<div class="note" data-note="' + esc(key) + '"' +
      (opt.fold ? ' data-hasfold="1"' : "") + (opt.meta ? ' data-hasmeta="1"' : "") + ">";
    items.forEach(function (it) { h += blkHtml(key, it, opt.canEdit(it), opt); });
    if (opt.canAdd) {
      var nid = newId(key), pk = pkOf(key, nid);
      h += '<div class="blk" data-new="1" data-id="' + esc(nid) + '" data-list="' + esc(key) + '">' +
        '<span class="grip ghost" aria-hidden="true"></span>' +
        taHtml(pk, key, nid, edit && edit.pk === pk ? edit.val : "",
               items.length ? "ここに続けて入力…" : opt.ph, opt.label) + "</div>";
    }
    return h + "</div>";
  }

  /* 末尾の空欄が1行になった瞬間。画面ごと作り直すと入力が途切れるので、その場で作り替える。 */
  function promoteRow(ta) {
    var blk = ta.parentNode;
    if (!blk || !blk.hasAttribute || !blk.hasAttribute("data-new")) return;
    var box = blk.parentNode; if (!box) return;
    var key = ta.getAttribute("data-list"), id = ta.getAttribute("data-id");
    var label = ta.getAttribute("aria-label") || "";
    blk.removeAttribute("data-new");
    ta.placeholder = "";        /* 実体になった行に「ここに続けて入力…」を残さない */
    var g = document.createElement("button");
    g.className = "grip"; g.type = "button"; g.tabIndex = -1;
    g.setAttribute("data-grip", ""); g.title = "つかんで上下に動かす";
    g.setAttribute("aria-label", "順番を変える"); g.textContent = "⣿";
    blk.replaceChild(g, blk.querySelector(".grip"));
    var x = document.createElement("button");
    x.className = "bx"; x.type = "button";
    x.setAttribute("data-act", "askdel");
    x.setAttribute("data-list", key); x.setAttribute("data-id", id);
    x.title = "この行を消す"; x.setAttribute("aria-label", "この行を消す");
    x.textContent = "×";
    if (box.hasAttribute("data-hasfold")) {
      var fb = document.createElement("button");
      fb.className = "fold"; fb.type = "button";
      fb.setAttribute("data-act", "fold");
      fb.setAttribute("data-fold", pkOf(key, id));
      fb.setAttribute("aria-expanded", "true");
      fb.title = "1行にたたむ"; fb.setAttribute("aria-label", "1行にたたむ");
      fb.textContent = "⌃";
      blk.appendChild(fb);
    }
    blk.appendChild(x);
    if (box.hasAttribute("data-hasmeta")) {
      var it = find(key, id);
      if (it) {
        var md = document.createElement("div");
        md.className = "meta";
        var st = stamp(it.createdAt);
        md.textContent = posterName(it.by) + (st ? " ・ " + st : "");
        blk.appendChild(md);
      }
    }
    var nid = newId(key), wrap = document.createElement("div");
    wrap.className = "blk";
    wrap.setAttribute("data-new", "1");
    wrap.setAttribute("data-id", nid);
    wrap.setAttribute("data-list", key);
    wrap.innerHTML = '<span class="grip ghost" aria-hidden="true"></span>' +
      taHtml(pkOf(key, nid), key, nid, "", "ここに続けて入力…", label);
    box.appendChild(wrap);
    grow(wrap.querySelector("textarea"));
  }

  function boardHtml(list) {
    return '<div class="cards">' + list.map(cardHtml).join("") + "</div>";
  }
  /* 1枚ぶん。書き足せるのはその役割の人だけ。もう一方は読むだけ。
     人が書いた行を直す・消せるのは本人と社長だけにする（施設メモと同じ規則）。
     同じ部屋に現場側が2人いるとき、互いの投稿を黙って書き換えられないようにするため。 */
  function cardHtml(c) {
    var canWrite = !!c.write;
    /* 書き手を入れ替えたとき、反対側が書いた行がその欄に残る。
       自分が書いた行だけは、今その欄を書けなくても直せるようにしておく
       （でないと、誰にも直せない・消せない行が残る）。 */
    var canEditItem = function (it) {
      if (!it || !me) return false;
      if (it.by === me.uid) return true;
      return canWrite && isCeo();
    };
    var h = '<section class="card" data-v="' + esc(c.voice) + '"><div class="card-h">' +
      '<h2 class="card-t">' + esc(c.title) + "</h2>" +
      '<span class="card-w">' + esc(c.who) +
      (canWrite ? "" : '<span class="ro">（あなたは読むだけ）</span>') + "</span></div>";
    var rows = rowsOf(c.key);
    if (!canWrite && !rows.length) {
      /* 中身のあるカードと同じ枠に収める。枠が無いと1枚だけ作りかけに見える。 */
      return h + '<div class="note"><p class="empty">まだ何も書かれていません。</p></div></section>';
    }
    if (canWrite && rows.some(function (it) { return !canEditItem(it); })) {
      h += '<p class="hint">自分が書いた行だけ直せます。</p>';
    }
    return h + noteHtml(c.key, {
      canAdd: canWrite, canEdit: canEditItem, label: c.title, ph: c.ph,
      fold: !!c.fold, meta: !!c.meta
    }) + "</section>";
  }

  function fieldHtml(stale, cold) {
    var h = "";
    if (stale.length || cold.length) {
      h += '<div class="alert"><div class="alert-h">止まっているもの</div><ul>';
      stale.forEach(function (c) { h += "<li>" + esc(c.title) + "（" + ago(c.updatedAt) + "から動いていない）</li>"; });
      cold.forEach(function (s) { h += "<li>" + esc(s.name) + "（" + ago(s.followedAt) + "から話せていない）</li>"; });
      h += "</ul></div>";
    }

    h += '<div class="pick"><select id="pickSel"><option value="">すべての施設</option>';
    field.facilities.forEach(function (f) {
      h += '<option value="' + esc(f.id) + '"' + (ui.pick === f.id ? " selected" : "") + ">" + esc(f.name) + "</option>";
    });
    h += '</select><button data-act="editlist">' + (ui.editList ? "リストを閉じる" : "施設リスト") + "</button></div>";

    if (ui.editList) {
      h += '<div class="panel"><h3>施設リスト</h3>';
      field.facilities.forEach(function (f) {
        h += '<div class="pline"><input value="' + esc(f.name) + '" data-list="facilities" data-id="' + esc(f.id) +
          '" data-field="name" placeholder="施設名">' +
          '<button data-act="del" data-list="facilities" data-id="' + esc(f.id) + '">削除</button></div>';
      });
      h += addHtml("facilities", "施設を追加", "施設名") + "</div>";
    }

    var shown = field.facilities.filter(function (f) { return f && (!ui.pick || f.id === ui.pick); });

    shown.forEach(function (f) {
      var key = "fac:" + f.id;
      h += '<div class="fac"><div class="fac-h">' +
        '<button class="dot" style="background:' +
          (STATUS.hasOwnProperty(f.status) ? STATUS[f.status] : STATUS.green) +
          '" data-act="cycle" data-id="' + esc(f.id) + '"></button>' +
        '<span class="fac-n">' + esc(f.name) + '</span><span class="fac-d">' + ago(f.updatedAt) + "</span></div>";
      /* 書き足しは全員できる。人が書いた行を直す・消せるのは本人と社長だけ（変更前と同じ）。 */
      var canEditItem = function (it) { return isCeo() || (me && it.by === me.uid); };
      if ((f.items || []).some(function (it) { return !canEditItem(it); })) {
        h += '<p class="hint">自分が書いた行だけ直せます。</p>';
      }
      h += noteHtml(key, {
        canAdd: true, canEdit: canEditItem,
        label: f.name, ph: "この施設のことを書き足す"
      }) + "</div>";
    });

    var match = function (x) { return !ui.pick || x.place === ui.pick; };
    /* 課題・対応事項。内容・担当・状態だけの一覧。 */
    var list = field.cases.filter(match);
    var open = list.filter(function (c) { return stat(c) !== "done"; });
    /* 完了の件数と「まとめて消す」は、いま画面に出ている範囲だけを対象にする。
       施設で絞っているときに、見えていない施設の分まで消さないため。 */
    var done = list.filter(function (c) { return stat(c) === "done"; });
    /* 完了は下へ寄せる。状態を変えた行が一覧から消えないように、同じ表に残す。 */
    var shownCases = open.concat(list.filter(function (c) { return stat(c) === "done"; }));

    h += '<section class="sec"><div class="sec-h"><h2 class="sec-t">課題・対応事項</h2>' +
      '<span class="sec-n">' + open.length + "件</span></div>";
    if (shownCases.length) {
      h += '<div class="tasks"><div class="thead"><span>内容</span><span>担当</span>' +
        "<span>状態</span><span></span></div>";
      shownCases.forEach(function (c) {
        var st = stat(c);
        h += '<div class="task' + (st === "done" ? " is-done" : "") + '">' +
          (c.place ? '<div class="tag">' + esc(facName(c.place)) + "</div>" : "") +
          '<input class="t-in t-name" data-pk="cases|' + esc(c.id) + '|title"' +
            ' data-list="cases" data-id="' + esc(c.id) +
            '" data-field="title" value="' + esc(c.title) + '" title="' + esc(c.title) +
            '" placeholder="内容" aria-label="内容">' +
          '<input class="t-in t-who" data-pk="cases|' + esc(c.id) + '|assignee"' +
            ' data-list="cases" data-id="' + esc(c.id) +
            '" data-field="assignee" value="' + esc(c.assignee || "") +
            '" title="' + esc(c.assignee || "") +
            '" placeholder="担当" aria-label="担当">' +
          '<select class="t-st" data-status data-id="' + esc(c.id) + '" aria-label="状態">' +
          ["todo", "doing", "done"].map(function (v) {
            return '<option value="' + v + '"' + (st === v ? " selected" : "") + ">" +
              STAT_LABEL[v] + "</option>";
          }).join("") + "</select>" +
          '<button class="t-del" data-act="del" data-list="cases" data-id="' + esc(c.id) +
            '" title="削除" aria-label="削除">×</button></div>';
      });
      h += "</div>";
    } else {
      h += '<p class="empty">まだありません。</p>';
    }
    h += addHtml("cases", "追加", "内容");
    if (done.length) h += '<p class="empty">完了 ' + done.length +
      '件<button style="background:none;border:0;color:var(--ink2);font-size:12px;margin-left:8px" data-act="clearDone">まとめて消す</button></p>';
    h += "</section>";

    var staff = field.staff.filter(match);
    h += '<section class="sec"><div class="sec-h"><h2 class="sec-t">スタッフで気になること</h2>' +
      '<span class="sec-n">' + staff.length + "人</span></div>";
    staff.forEach(function (p) {
      var isCold = now() - (p.followedAt || 0) > 14 * DAY;
      h += '<div class="row' + (isCold ? " stale" : "") + '"><div class="row-h">' +
        '<span class="row-n">' + esc(p.name) + "</span>" +
        (isCold ? '<span class="flag">フォロー切れ</span>' : "") +
        '<span class="row-d">' + ago(p.followedAt) + "</span></div>" +
        (p.place ? '<div class="tag">' + esc(facName(p.place)) + "</div>" : "") +
        '<input class="inline" data-list="staff" data-id="' + esc(p.id) + '" data-field="concern" value="' +
        esc(p.concern) + '" placeholder="気になっていること">' +
        '<div class="acts"><button data-act="talked" data-id="' + esc(p.id) + '">話した</button>' +
        '<button class="del" data-act="del" data-list="staff" data-id="' + esc(p.id) + '">削除</button></div></div>';
    });
    return h + addHtml("staff", "スタッフを追加", "スタッフ名") + "</section>";
  }

  function addHtml(list, label, ph) {
    if (ui.addOpen !== list) return '<button class="add" data-act="addopen" data-list="' + list + '">＋ ' + label + "</button>";
    var h = '<div class="rin"><input id="addInput" value="' + esc(ui.addDraft) + '" placeholder="' + ph + '">';
    if (list !== "facilities" && field.facilities.length) {
      h += '<select id="addPlace" style="font-family:inherit;font-size:13px;border:1px solid var(--line);border-radius:3px;background:var(--surface);padding:0 4px">' +
        '<option value="">施設なし</option>';
      field.facilities.forEach(function (f) {
        var sel = (ui.addPlace || ui.pick) === f.id ? " selected" : "";
        h += '<option value="' + esc(f.id) + '"' + sel + ">" + esc(f.name) + "</option>";
      });
      h += "</select>";
    }
    return h + '<button class="send plain" data-act="addsend" data-list="' + list + '">追加</button></div>';
  }

  /* ---------- 操作 ---------- */
  document.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("[data-act]") : null;
    if (!b) return;
    var act = b.getAttribute("data-act"), list = b.getAttribute("data-list"),
        id = b.getAttribute("data-id"), v = b.getAttribute("data-v"), it;

    if (act === "login") {
      var m = document.querySelector("#mail"), w = document.querySelector("#pw");
      ui.gateErr = "";
      auth.signInWithEmailAndPassword((m ? m.value : "").trim(), w ? w.value : "")
        .catch(function (err) {
          ui.gateErr = /invalid-credential|wrong-password|user-not-found/.test(err.code)
            ? "メールアドレスかパスワードが違います。" : "開けませんでした（" + err.code + "）";
          render();
        });
      return;
    }
    if (act === "forgot") {
      var m2 = document.querySelector("#mail");
      var addr = (m2 ? m2.value : "").trim();
      if (!addr) { ui.gateErr = "先にメールアドレスを入れてください。"; render(); return; }
      auth.sendPasswordResetEmail(addr)
        .then(function () { ui.gateErr = "再設定のメールを送りました。"; render(); })
        .catch(function (err) { ui.gateErr = "送れませんでした（" + err.code + "）"; render(); });
      return;
    }

    captureDrafts();
    commitEdit();
    if (act !== "askdel" && act !== "dodel" && act !== "nodel") ui.confirmDel = "";
    ui.msg = "";

    if (act === "logout") {
      /* 書きかけを出しきってからログアウトする（権限が切れて保存が落ちないように）。
         回線が悪いと保存の返事が来ないので、待つのは 1.5 秒まで。
         送りそこねた分は Firebase 側が再接続時に送り直す。 */
      ui.saving = "ログアウトしています";
      paintStatus();
      var out = function () { auth.signOut(); };
      /* flushSaves() は呼んだ時点で保留分を取り出すので、2回呼ぶと2回目が空で即決着する。
         必ず1回だけ呼び、その結果を待つこと。 */
      Promise.race([
        Promise.all([flushSaves(), flushShares()]),
        new Promise(function (r) { setTimeout(r, 1500); })
      ]).then(out, out);
      return;
    }
    else if (act === "tab") ui.tab = v;
    else if (act === "room") {
      flushSaves();                       /* 前の部屋の保存を先に出しきる */
      failed = {}; failMsg = "";           /* 前の部屋の失敗表示は持ち越さない */
      ui.room = id; ui.confirmDel = ""; edit = null; ui.newId = {}; ui.fresh = {}; ui.open = {};
      ui.share = false; ui.showUrl = "";      /* 別のボードの共有パネルを開いたままにしない */
    }
    else if (act === "settings") { ui.settings = !ui.settings; if (ui.settings) ui.share = false; }
    else if (act === "share") { ui.share = !ui.share; if (ui.share) ui.settings = false; ui.showUrl = ""; }
    else if (act === "invite") ui.invite = !ui.invite;
    else if (act === "newroom") {
      ui.newRoom = !ui.newRoom; ui.newRoomName = ""; ui.newRoomPick = {};
      /* ⚠ ここで消さないと「変える → やめる → ＋ → 作る」で、
         下の capture 側が前に選んだボードの名前とメンバーを黙って上書きする。 */
      ui.editingRoom = null;
    }
    else if (act === "makeroom") {
      var nm = (ui.newRoomName || "").trim();
      if (!nm) { ui.msg = "部屋の名前を入れてください。"; render(); return; }
      var mem = {}; mem[me.uid] = true;
      /* 名簿に居る人だけを入れる。消した人の選択が残っていると、
         部屋には入るのに members 側が書けず（.validate で落ちる）、幽霊のメンバー行が残る。 */
      Object.keys(ui.newRoomPick).forEach(function (u) {
        if (ui.newRoomPick[u] && owns(members, u)) mem[u] = true;
      });
      var rid = uid();
      rtdb.ref("rooms/" + rid).set({ name: nm, members: mem, board: EMPTY_BOARD })
        .then(function () {
          var up = {};
          Object.keys(mem).forEach(function (u) { up["members/" + u + "/rooms/" + rid] = true; });
          return rtdb.ref().update(up);
        })
        .then(function () { ui.room = rid; ui.newRoom = false; render(); })
        .catch(function (err) { ui.msg = "作れませんでした（" + err.code + "）"; render(); });
      return;
    }
    else if (act === "editroom") {
      var r = rooms[id];
      ui.newRoom = true; ui.newRoomName = r.name || ""; ui.newRoomPick = {};
      Object.keys(r.members || {}).forEach(function (u) { ui.newRoomPick[u] = true; });
      ui.editingRoom = id;
      ui.settings = false;
    }
    else if (act === "delroom") {
      if (!okId(id) || !rooms[id]) return;
      var rr = rooms[id];
      var rsh = sharesOf(id);
      if (!confirm("「" + roomLabel(id) + "」を消します。中身も消えます。" +
                   (rsh.length ? "渡してある共有リンク " + rsh.length + "件も使えなくなります。" : "") +
                   "よろしいですか？")) return;
      var upd = {}; upd["rooms/" + id] = null;
      Object.keys(rr.members || {}).forEach(function (u) { upd["members/" + u + "/rooms/" + id] = null; });
      /* 部屋が消えると見せる中身も無くなる。台帳と写しの両方を落とす。
         片方だけ残すと、渡したURLが「使えません」のまま台帳に残り続ける。 */
      var kept = [];
      rsh.forEach(function (sid) {
        var tk = shares[sid] && shares[sid].token;
        kept.push({ sid: sid, rec: shares[sid] });
        upd["shares/" + sid] = null;
        if (okToken(tk)) { upd["views/" + tk] = null; delete shareSent[tk]; }
        delete shares[sid];
      });
      stopShareTimer();
      rtdb.ref().update(upd).then(function () { syncSharesSoon(); render(); },
        function (err) {
          /* 消せなかったのに画面から消えると、生きているURLを止められなくなる */
          kept.forEach(function (x) { shares[x.sid] = x.rec; });
          syncSharesSoon();
          ui.msg = "消せませんでした（" + ((err && err.code) || "原因不明") + "）";
          render();
        });
      return;
    }
    else if (act === "delmember") {
      /* 利用者を消す。消すのは「その人の登録」だけ。
         ・rooms/{全部屋}/members/{uid}  … 部屋のメンバー登録（認可の正）
         ・members/{uid}                 … 名簿（配下の rooms も一緒に消える。表示の正）
         ⚠ 共有リンク（shares）はボードに紐づくもので、利用者には紐づかない。
           ここでは触らない。止めたいときは、そのボードの「共有」から止める。
         部屋そのもの・共有ボードの中身・現場マネジメントは消さない。
         Firebase Auth のアカウントも消さない（消せる仕組みをアプリに持たせない）。 */
      if (!id || typeof id !== "string" || id.indexOf("/") >= 0 ||
          !owns(members, id) || id === me.uid) return;
      /* 部屋と名簿が揃う前に消すと、入っている部屋を取りこぼす */
      if (!gotRooms || !gotMembers) {
        ui.msg = "読み込み中です。少し待ってからもう一度押してください。";
        render(); return;
      }
      var who = members[id] || {};
      /* ⚠ 共有リンクはボードに紐づくので、利用者を消しても失効しない。
         旧「利用者ごとの閲覧リンク」は消せば失効したため、同じつもりで押されると
         止めたはずのURLが生き残る。件数を出して、止め方まで書く。 */
      var liveShares = Object.keys(shares).length;
      if (!confirm("この利用者を削除しますか？\n\n" + (who.name || who.mail || "") +
                   "\n\n全部の部屋から外れ、ログインできなくなります。\n" +
                   "共有ボードに書かれた内容は残ります。\n\n" +
                   "⚠ 渡してある共有リンクは、これでは止まりません" +
                   (liveShares ? "（今 " + liveShares + "件）" : "") + "。\n" +
                   "止めるときは、そのボードの「共有」から「共有をやめる」を押してください。\n\n" +
                   "元に戻すには「人を追加する」で、同じメールアドレスと" +
                   "そのパスワードを入れ直す必要があります。")) return;

      var rids = {}, dupd = {};
      /* 部屋の側と名簿の側は二重に持っている。取りこぼさないよう両方から集める。 */
      Object.keys(rooms).forEach(function (rid) {
        var r = rooms[rid];
        if (r && owns(r.members || {}, id)) rids[rid] = 1;
      });
      Object.keys(who.rooms || {}).forEach(function (rid) { rids[rid] = 1; });
      Object.keys(rids).forEach(function (rid) {
        if (rid && rid.indexOf("/") < 0) dupd["rooms/" + rid + "/members/" + id] = null;
      });
      dupd["members/" + id] = null;

      rtdb.ref().update(dupd)
        .then(function () {
          /* 画面に残った選択も落とす。残すと、次に部屋を作るときへ紛れ込む */
          delete ui.newRoomPick[id];
          /* ログイン用のアカウントはアプリからは消せない。消し忘れると、その人は
             timecard 側のデータへ入れるままになるので、後始末の手がかりを必ず残す。 */
          ui.msg = (who.name || who.mail || "利用者") + " を削除しました。" +
            (liveShares ? "渡してある共有リンク " + liveShares +
              "件は止まっていません。止めるときは各ボードの「共有」から。" : "") +
            "ログイン用のアカウントは残っています。完全に止めるには、Firebase コンソールで " +
            (who.mail || "そのメールアドレス") + " のアカウントを無効化してください。";
          syncSharesSoon(); render();
        })
        .catch(function (err) {
          ui.msg = "削除できませんでした（" + ((err && err.code) || "原因不明") + "）";
          render();
        });
      return;
    }
    /* 共有リンクを作る。相手の利用者登録も、ボードのメンバー追加もしない。
